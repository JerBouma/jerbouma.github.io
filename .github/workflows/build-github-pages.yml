# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuilds every Monday morning so the project stats (stars, forks,
  # downloads; see _plugins/live_stats.rb) stay current without a commit
  schedule:
    - cron: "0 6 * * 1"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: _plugins/last_modified.rb dates pages from git log
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher GitHub API limit for the live stats
      - name: Print the CV to PDF
        # Renders /resume/cv (built from _data/resume.yml) to
        # _site/assets/files/jeroen-bouma-cv.pdf so the download always matches
        # the resume. If this step fails, the copy committed in assets/files/
        # is deployed instead, so it never blocks a deploy.
        continue-on-error: true
        run: |
          # GitHub's runners come with Google Chrome, so use it instead of
          # downloading Chromium and its system packages on every run (that
          # download took 30 seconds to 5+ minutes). Falls back to the download
          # only when Chrome is missing.
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --no-package-lock --prefix _scripts playwright@1.63.0
          if [ -z "$CHROME" ]; then npx --prefix _scripts playwright install --with-deps chromium; fi
          CHROME="$CHROME" NODE_PATH=_scripts/node_modules node _scripts/build-cv-pdf.js
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v4

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
