# Builds the site on every pull request so a broken build is caught before it
# reaches main (where a push deploys straight to the live site). Nothing is
# deployed from here. Ruby 4.0 is checked as well but allowed to fail, to see
# when the toolchain is ready for it.
name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    continue-on-error: ${{ matrix.ruby == '4.0' }}
    name: Jekyll build (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Report output size
        run: du -sh _site && find _site -type f -size +1M -printf '%s %p\n' | sort -rn | awk '{printf "%6.1fMB %s\n",$1/1048576,$2}'
