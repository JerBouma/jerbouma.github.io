# Builds the site on every pull request so a broken build is caught before it
# reaches main (where a push deploys straight to the live site). Nothing is
# deployed from here. Both Rubies in use are checked: 4.0 builds the live site,
# 3.4 runs the Algolia reindex.
name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    name: Jekyll build (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # same as the deploy: _plugins/last_modified.rb reads git log
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Print the CV to PDF
        # the same step as the deploy, so a change that breaks the CV shows up here
        if: matrix.ruby == '4.0'
        run: |
          # GitHub's runners come with Google Chrome, so use it instead of
          # downloading Chromium and its system packages on every run (that
          # download took 30 seconds to 5+ minutes). Falls back to the download
          # only when Chrome is missing.
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --no-package-lock --prefix _scripts playwright@1.63.0
          if [ -z "$CHROME" ]; then npx --prefix _scripts playwright install --with-deps chromium; fi
          CHROME="$CHROME" NODE_PATH=_scripts/node_modules node _scripts/build-cv-pdf.js
      - name: Report output size
        run: du -sh _site && find _site -type f -size +1M -printf '%s %p\n' | sort -rn | awk '{printf "%6.1fMB %s\n",$1/1048576,$2}'
