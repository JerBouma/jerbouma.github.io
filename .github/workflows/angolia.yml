name: Enable Angolia Search
  
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  algolia-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          # jekyll-algolia (last release 2021) loads fine on Ruby 4.0 in the build check,
          # but the actual indexing run has only been exercised on 3.4; bump once verified.
          ruby-version: '3.4'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Exec jekyll algolia
        run: bundle exec jekyll algolia
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}