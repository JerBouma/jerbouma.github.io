<!doctype html>
<!--
  Template for the share images (og:image), rendered per page by
  _scripts/build-share-images.js from _site/assets/images/share/manifest.json.
  Same look as the homepage hero: dark grid, glow, portrait in a gradient ring.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: 'Inter', sans-serif; color: #f8fafc;
    background: radial-gradient(ellipse 90% 80% at 15% 0%, #13213a 0%, #0b1220 55%, #070b14 100%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(148,163,184,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,0.08) 1px, transparent 1px);
    background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 70% 80% at 45% 45%, #000 25%, transparent 80%); }
  .glow { position: absolute; right: -120px; top: -140px; width: 760px; height: 760px;
    background: radial-gradient(closest-side, rgba(56,189,248,0.22), rgba(129,140,248,0.12) 45%, transparent 100%); filter: blur(10px); }
  .chart { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; opacity: 0.5; }
  .text { position: absolute; left: 72px; top: 0; bottom: 120px; width: 700px; display: flex; flex-direction: column; justify-content: center; }
  .name { font-family: 'Sora', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; margin-bottom: 30px; }
  .name i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-left: 8px; background: linear-gradient(120deg, #38bdf8, #c084fc); }
  .section { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px;
    background: linear-gradient(120deg, #38bdf8, #818cf8 60%, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  h1 { font-family: 'Sora', sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1.06;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .accent { background: linear-gradient(120deg, #38bdf8, #818cf8 60%, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .description { margin-top: 22px; font-size: 22px; line-height: 1.45; color: #cbd5e1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .description span { color: #64748b; margin: 0 10px; }
  .url { position: absolute; left: 72px; bottom: 54px; font-size: 21px; font-weight: 600; color: #94a3b8; }
  .url b { color: #38bdf8; font-weight: 600; }
  .portrait { position: absolute; right: 86px; top: 150px; width: 300px; height: 300px; border-radius: 50%; padding: 6px;
    background: conic-gradient(from 200deg, #38bdf8, #818cf8, #c084fc, #38bdf8); box-shadow: 0 30px 90px rgba(56,189,248,0.28); }
  .portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 7px solid #0b1220; display: block; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <svg class="chart" viewBox="0 0 1200 190" preserveAspectRatio="none">
    <defs>
      <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.35" stop-color="#38bdf8"/><stop offset="0.75" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
      <linearGradient id="f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity="0.22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M0,150 L60,142 L120,148 L180,128 L240,134 L300,112 L360,120 L420,96 L480,108 L540,88 L600,100 L660,74 L720,86 L780,62 L840,78 L900,54 L960,66 L1020,40 L1080,52 L1140,30 L1200,22 L1200,190 L0,190 Z" fill="url(#f)"/>
    <path d="M0,150 L60,142 L120,148 L180,128 L240,134 L300,112 L360,120 L420,96 L480,108 L540,88 L600,100 L660,74 L720,86 L780,62 L840,78 L900,54 L960,66 L1020,40 L1080,52 L1140,30 L1200,22" fill="none" stroke="url(#l)" stroke-width="3"/>
  </svg>
  <div class="text">
    <div class="name">Jeroen Bouma<i></i></div>
    <div class="section" id="section"></div>
    <h1 id="title"></h1>
    <p class="description" id="description"></p>
  </div>
  <p class="url"><b>jeroenbouma</b>.com<span id="path"></span></p>
  <div class="portrait"><img id="photo" alt=""></div>
  <script>
    // fills the template for one page; called by build-share-images.js
    window.fill = function (item) {
      var t = document.getElementById('title');
      var d = document.getElementById('description');
      // the page is reused for every image, so start from a clean slate
      t.removeAttribute('style'); d.removeAttribute('style');
      document.getElementById('section').textContent = item.section || '';
      document.getElementById('section').style.display = item.section ? '' : 'none';
      document.getElementById('path').textContent = item.path || '';
      if (item.home) {
        t.innerHTML = 'Analyzing economies and markets,<br><span class="accent">sharpened by AI.</span>';
        t.style.fontSize = '64px';
        d.innerHTML = 'Quantitative Investment Strategist<span>·</span>Creator of the Finance Toolkit';
        return;
      }
      t.textContent = item.title;
      d.textContent = item.description || '';
      d.style.display = item.description ? '' : 'none';
      // the longer the title, the smaller the type: three lines at most
      var n = item.title.length;
      t.style.fontSize = (n <= 24 ? 66 : n <= 40 ? 56 : n <= 64 ? 46 : 40) + 'px';
      if (n > 64) d.style.webkitLineClamp = 1;
    };
  </script>
</body></html>
