  subtitle: By strike, a line per expiration

get_bjerksund_stensland:
  chart: line
  format: price
  xname: Strike price
  title: Bjerksund-Stensland Call Price
  subtitle: By strike, a line per expiration

get_monte_carlo_option_price:
  chart: line
  format: price
  xname: Strike price
