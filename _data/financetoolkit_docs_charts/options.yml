get_black_scholes_model:
  chart: line
  format: price
  xname: Strike price
  title: Black-Scholes Call Price
  subtitle: By strike, a line per expiration

get_put_call_parity:
  chart: none
  reason: Black-Scholes call and put prices satisfy parity by construction, so the gap is zero at every strike

get_garman_kohlhagen:
  chart: line
  format: price
  xname: Strike price
  title: Garman-Kohlhagen Call Price
  subtitle: By strike, a line per expiration

get_binary_option:
  chart: line
  format: decimal
  xname: Strike price
