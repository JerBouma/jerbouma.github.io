get_option_chains:
  chart: none
  reason: An option chain is a quote sheet, read per strike as a table

collect_all_greeks:
  chart: tabs
  title: Option Greeks
  tabs:
    - label: Delta
      chart: line
      columns: [Delta]
      format: decimal
      xname: Strike price
      subtitle: By strike, for the example's valuation date and expiration
    - label: Gamma
      chart: line
      columns: [Gamma]
      format: decimal
      xname: Strike price
      subtitle: By strike, for the example's valuation date and expiration
    - label: Vega
      chart: line
      columns: [Vega]
      format: decimal
      xname: Strike price
      subtitle: By strike, for the example's valuation date and expiration
    - label: Theta
      chart: line
      columns: [Theta]
      format: decimal
      xname: Strike price
      subtitle: By strike, for the example's valuation date and expiration

collect_first_order_greeks:
  chart: tabs
  title: First-Order Greeks
  expr: "(lambda f: f.loc[:, [c for c in f.columns if c[0] in set(f.columns.get_level_values(0).unique()[[0, 7, -1]])]])(toolkit.options.collect_first_order_greeks().loc['AAPL'])"
  tabs:
    - label: Delta
      chart: line
      ticker: Delta
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in price per 1 change in the stock price; by strike, a line per expiration
    - label: Vega
      chart: line
      ticker: Vega
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in price per 1 point change in volatility; by strike, a line per expiration
    - label: Theta
      chart: line
      ticker: Theta
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in price per day; by strike, a line per expiration
    - label: Rho
      chart: line
      ticker: Rho
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in price per 1 point change in the rate; by strike, a line per expiration

collect_second_order_greeks:
  chart: tabs
  title: Second-Order Greeks
  expr: "(lambda f: f.loc[:, [c for c in f.columns if c[0] in set(f.columns.get_level_values(0).unique()[[0, 7, -1]])]])(toolkit.options.collect_second_order_greeks().loc['AAPL'])"
  tabs:
    - label: Gamma
      chart: line
      ticker: Gamma
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in delta per 1 change in the stock price; by strike, a line per expiration
    - label: Vanna
      chart: line
      ticker: Vanna
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in delta per 1 point change in volatility; by strike, a line per expiration
    - label: Charm
      chart: line
      ticker: Charm
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in delta per day; by strike, a line per expiration
    - label: Vomma
      chart: line
      ticker: Vomma
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in vega per 1 point change in volatility; by strike, a line per expiration

collect_third_order_greeks:
  chart: tabs
  title: Third-Order Greeks
  expr: "(lambda f: f.loc[:, [c for c in f.columns if c[0] in set(f.columns.get_level_values(0).unique()[[0, 7, -1]])]])(toolkit.options.collect_third_order_greeks().loc['MU'])"
  tabs:
    - label: Speed
      chart: line
      ticker: Speed
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in gamma per 1 change in the stock price; by strike, a line per expiration
    - label: Zomma
      chart: line
      ticker: Zomma
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in gamma per 1 point change in volatility; by strike, a line per expiration
    - label: Color
      chart: line
      ticker: Color
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in gamma per day; by strike, a line per expiration
    - label: Ultima
      chart: line
      ticker: Ultima
      level: 1
      format: decimal
      xname: Strike price
      subtitle: Change in vomma per 1 point change in volatility; by strike, a line per expiration

