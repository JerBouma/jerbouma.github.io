  subtitle: By strike, a line per expiration

get_asian_option:
  chart: line
  format: price
  xname: Strike price
  title: Asian Call Price
  subtitle: By strike, a line per expiration


get_put_call_ratio:
  chart: bar
  columns: [Volume Put-Call Ratio, Open Interest Put-Call Ratio]
  format: ratio
  cards: false
  levels: [1]
  title: Put-Call Ratio
  subtitle: Put over call volume and open interest, per expiration and for all expirations together

get_max_pain:
  chart: line
  ticker: AAPL
  level: 0
  columns: [Max Pain, Stock Price]
  dots: [Max Pain]
  format: price
  title: Max Pain and Stock Price
  subtitle: Strike where option holders lose the most at expiration, per expiration

get_gamma_exposure:
  chart: bar
  columns: [Call Gamma Exposure, Put Gamma Exposure, Net Gamma Exposure]
  format: compact
  cards: false
  levels: [0]
  title: Dealer Gamma Exposure
  subtitle: Dollar gamma per 1% move in the stock, from calls, puts and net

get_implied_volatility_term_structure:
  chart: line
  expr: "toolkit.options.get_implied_volatility_term_structure(number_of_expirations=5).set_index('Days to Expiration', append=True)['At-the-Money Volatility'].droplevel('Expiration').unstack('Ticker')"
  format: percent
  xname: Days to expiration
  title: Implied Volatility Term Structure
  subtitle: At-the-money implied volatility by days to expiration

get_volatility_skew:
  chart: line
  transpose: true
  rows:
    - 25-Delta Put Volatility: 25-delta put
    - At-the-Money Volatility: At the money
    - 25-Delta Call Volatility: 25-delta call
  format: percent
  title: Volatility Skew
  subtitle: Implied volatility at the 25-delta put, at the money and the 25-delta call, a line per expiration

get_implied_move:
  chart: bar
  columns: [Implied Move]
  format: percent
  title: Implied Move
  subtitle: At-the-money straddle price as a share of the stock price, for the expiration after earnings

get_model_free_implied_volatility:
  chart: bar
  columns: [Model-Free Implied Volatility]
  format: percent
  title: Model-Free Implied Volatility
  subtitle: VIX method, interpolated to 30 days

get_volatility_risk_premium:
  chart: bar
  columns: [Implied Volatility, Realized Volatility]
  format: percent
  cards: false
  title: Implied and Realized Volatility
  subtitle: The gap between them is the volatility risk premium

get_risk_neutral_moments:
  chart: tabs
  title: Risk-Neutral Moments
  tabs:
    - label: Volatility
      chart: bar
      columns: [Volatility]
      format: percent
      cards: false
      subtitle: Per expiration
    - label: Skewness
      chart: bar
      columns: [Skewness]
      format: ratio
      cards: false
      levels: [0]
      subtitle: Per expiration; below zero the left tail is heavier
    - label: Kurtosis
      chart: bar
      columns: [Kurtosis]
      format: ratio
      cards: false
      levels: [3]
      subtitle: Per expiration; a normal distribution has 3

get_skew_index:
  chart: bar
  columns: [SKEW Index]
  format: number
  title: SKEW Index
  subtitle: 100 means a normal distribution; higher means more tail risk on the downside

get_binomial_model:
  chart: none
  reason: A binomial tree holds a value per node, which reads as a table of up and down moves

get_stock_price_simulation:
  chart: line
  transpose: true
  format: price
  title: Binomial Stock Price Paths
  subtitle: Stock price at each step, a line per sequence of up and down moves

get_strategy_payoff:
  chart: line
  area: [TSLA]
  format: price
  levels: [0]
  xname: Stock price at expiration
  title: Strategy Payoff
  subtitle: Profit or loss at expiration by stock price

get_implied_volatility:
  chart: line
  format: percent
  xname: Strike price
  title: Implied Volatility Smile
  subtitle: By strike, for the nearest expiration

get_volatility_surface:
  chart: line
  format: percent
  xname: Strike price
  title: Implied Volatility Surface
  subtitle: Implied volatility by strike, a line per expiration

get_risk_neutral_density:
  chart: area
  expr: "toolkit.options.get_risk_neutral_density(strike_price_range=0.1, number_of_strikes=81).rename(index=lambda v: round(v, 1))"
  format: decimal
  xname: Strike price
  title: Risk-Neutral Density
  subtitle: Probability density of the price at expiration implied by option prices
