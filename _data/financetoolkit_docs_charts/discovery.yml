  title: Industry P/E Ratio

get_industry_statistics:
  chart: bar
  expr: "cost_of_capital.loc[['Semiconductor', 'Software (System & Application)', 'Utility (General)', 'Total Market'], ['Beta', 'Cost of Equity', 'After-tax Cost of Debt', 'D/(D+E)', 'Cost of Capital']].round(4)"
  columns: [Cost of Equity, After-tax Cost of Debt, Cost of Capital]
  format: percent
  title: Cost of Capital by Industry
  subtitle: Cost of capital weighs the cost of equity and the after-tax cost of debt by D/(D+E)

