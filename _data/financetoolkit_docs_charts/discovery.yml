search_instruments:
  chart: none
  reason: A list of matching instruments, read as a table

get_stock_screener:
  chart: none
  reason: A list of companies that pass the filters, read as a table

get_stock_list:
  chart: none
  reason: A list of instruments, read as a table

get_stock_shares_float:
  chart: none
  reason: A list of float figures for every listed company, too many to chart

get_sectors_performance:
  chart: tabs
  title: Sector Performance
  tabs:
    - label: Cyclical
      chart: line
      derive:
        Basic Materials: "(1 + f['Basic Materials'].fillna(0)).cumprod() - 1"
        Consumer Cyclical: "(1 + f['Consumer Cyclical'].fillna(0)).cumprod() - 1"
        Financial Services: "(1 + f['Financial Services'].fillna(0)).cumprod() - 1"
        Real Estate: "(1 + f['Real Estate'].fillna(0)).cumprod() - 1"
      columns: [Basic Materials, Consumer Cyclical, Financial Services, Real Estate]
      format: percent
      levels: [0]
      subtitle: Cumulative return from the daily average change of each sector
    - label: Sensitive
      chart: line
      derive:
        Communication Services: "(1 + f['Communication Services'].fillna(0)).cumprod() - 1"
        Energy: "(1 + f['Energy'].fillna(0)).cumprod() - 1"
        Industrials: "(1 + f['Industrials'].fillna(0)).cumprod() - 1"
        Technology: "(1 + f['Technology'].fillna(0)).cumprod() - 1"
      columns: [Communication Services, Energy, Industrials, Technology]
      format: percent
      levels: [0]
      subtitle: Cumulative return from the daily average change of each sector
    - label: Defensive
      chart: line
      derive:
        Consumer Defensive: "(1 + f['Consumer Defensive'].fillna(0)).cumprod() - 1"
        Healthcare: "(1 + f['Healthcare'].fillna(0)).cumprod() - 1"
        Utilities: "(1 + f['Utilities'].fillna(0)).cumprod() - 1"
      columns: [Consumer Defensive, Healthcare, Utilities]
      format: percent
      levels: [0]
      subtitle: Cumulative return from the daily average change of each sector

get_biggest_gainers:
  chart: hbar
  columns: [Change %]
  first: 10
  sort: desc
  format: percent
  title: Biggest Gainers
  subtitle: Price change of the day

get_biggest_losers:
  chart: hbar
  columns: [Change %]
  first: 10
  sort: asc
  format: percent
  title: Biggest Losers
  subtitle: Price change of the day

