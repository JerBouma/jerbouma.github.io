get_sector_performance:
  chart: area
  derive:
    Energy: "(1 + f['Average Change'].fillna(0)).cumprod() - 1"
  columns: [Energy]
  format: percent
  levels: [0]
  title: Sector Performance
  subtitle: Cumulative return from the daily average change of the sector

get_industry_performance:
  chart: area
  derive:
    Biotechnology: "(1 + f['Average Change'].fillna(0)).cumprod() - 1"
  columns: [Biotechnology]
  format: percent
  levels: [0]
  title: Industry Performance
  subtitle: Cumulative return from the daily average change of the industry

get_sector_pe:
  chart: line
  columns: [{PE Ratio: Energy}]
  format: multiple
  title: Sector P/E Ratio

get_industry_pe:
  chart: line
