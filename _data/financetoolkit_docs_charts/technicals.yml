  price: "AUDUSD"
  price_name: AUD/USD
  lower:
    series:
      - {column: "VI+", color: "#22c55e"}
      - {column: "VI-", color: "#ef4444"}
    levels: [1]
    format: decimal
  zoom: 252
  title: Vortex Indicator

get_bollinger_percent_b_and_bandwidth:
  chart: ta
  ticker: "AAPL"
  price: "AAPL"
  price_name: Apple
  lower:
    series:
      - {column: "%B", color: "#38bdf8"}
      - {column: "BandWidth", color: "#f97316"}
