      - {column: Histogram, bar: true, signed: true}
      - {column: "MACD Line", color: "#38bdf8"}
      - {column: "Signal Line", color: "#f97316"}
    levels: [0]
  zoom: 252
  title: MACD

get_percentage_volume_oscillator:
  chart: ta
