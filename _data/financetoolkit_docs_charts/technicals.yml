    format: decimal
  zoom: 252
  title: Bollinger %B and BandWidth
  subtitle: "%B above 1 means the price is over the upper band, below 0 under the lower band"

get_mass_index:
  chart: ta
  price: "AMZN"
  price_name: Amazon
  lower:
    series:
      - {column: "AMZN", name: "Mass Index", color: "#a78bfa"}
    levels: [26.5, 27]
    format: number
  zoom: 252
  title: Mass Index
  subtitle: A rise above 27 followed by a drop below 26.5 is the classic reversal bulge

get_moving_average_convergence_divergence:
  chart: ta
  ticker: "MSFT"
  price: "MSFT"
  price_name: Microsoft
  derive: {Histogram: "f['MACD Line'] - f['Signal Line']"}
