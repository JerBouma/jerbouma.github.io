# Technical indicators, drawn as charting packages draw them (chart: ta): the price as
# candlesticks with the overlays on it, the indicator in a panel underneath with its usual levels.

get_bollinger_bands:
  chart: ta
  ticker: "USDJPY"
  price: "USDJPY"
  price_name: USD/JPY
  overlays:
    - {column: "Upper Band", color: "#818cf8"}
    - {column: "Middle Band", color: "#f97316", dashed: true}
    - {column: "Lower Band", color: "#818cf8"}
  fill: [Upper Band, Lower Band]
  zoom: 252
  title: Bollinger Bands

get_keltner_channels:
  chart: ta
  ticker: "^GDAXI"
  price: "^GDAXI"
  price_name: DAX
  format: amount
  overlays:
    - {column: "Upper Line", color: "#818cf8"}
    - {column: "Middle Line", color: "#f97316", dashed: true}
    - {column: "Lower Line", color: "#818cf8"}
  fill: [Upper Line, Lower Line]
  zoom: 252
  title: Keltner Channels

get_donchian_channels:
  chart: ta
  ticker: "HGUSD"
  price: "HGUSD"
  price_name: Copper
  overlays:
    - {column: "Upper Channel", color: "#818cf8"}
    - {column: "Middle Channel", color: "#f97316", dashed: true}
    - {column: "Lower Channel", color: "#818cf8"}
  fill: [Upper Channel, Lower Channel]
  zoom: 252
  title: Donchian Channels

get_ichimoku_cloud:
  chart: ta
  ticker: "^N225"
  price: "^N225"
  price_name: Nikkei 225
  format: amount
  overlays:
    - {column: "Conversion Line", color: "#38bdf8"}
    - {column: "Base Line", color: "#f97316"}
    - {column: "Leading Span A", color: "#22c55e"}
    - {column: "Leading Span B", color: "#ef4444"}
  fill: [Leading Span A, Leading Span B]
  fill_colors: ["#22c55e", "#ef4444"]
  zoom: 252
  title: Ichimoku Cloud
  subtitle: The cloud is green where Leading Span A is above Leading Span B, red where it is below

get_supertrend:
  chart: ta
  ticker: "SHOP"
  price: "SHOP"
  price_name: Shopify
  derive:
    Uptrend: "f['Supertrend'].where(f['Trend Direction'] == 1)"
    Downtrend: "f['Supertrend'].where(f['Trend Direction'] == -1)"
  overlays:
    - {column: "Uptrend", color: "#22c55e"}
    - {column: "Downtrend", color: "#ef4444"}
  zoom: 252
  title: Supertrend

get_moving_average:
  chart: ta
  price: "^GSPC"
  price_name: S&P 500
  format: amount
  overlays:
    - {column: "^GSPC", name: "50-Day Moving Average", color: "#f97316"}
  zoom: 252
  title: Moving Average

get_volume_weighted_average_price:
  chart: ta
  price: "SPY"
  price_name: SPY
  overlays:
    - {column: "SPY", name: "VWAP", color: "#f97316"}
  zoom: 252
  title: Volume Weighted Average Price

get_parabolic_sar:
  chart: ta
  price: "CLUSD"
  price_name: Crude oil
  overlays:
    - {column: "CLUSD", name: "Parabolic SAR", color: "#38bdf8", dots: true}
  zoom: 252
  title: Parabolic SAR
  subtitle: Dots below the price mark an uptrend, above it a downtrend

get_chandelier_exit:
  chart: ta
  ticker: "TSLA"
  price: "TSLA"
  price_name: Tesla
  overlays:
    - {column: "Long Exit", color: "#22c55e"}
    - {column: "Short Exit", color: "#ef4444"}
  zoom: 252
  title: Chandelier Exit

get_support_resistance_levels:
  chart: ta
  ticker: "GCUSD"
  price: "GCUSD"
  price_name: Gold
  format: amount
  overlays:
    - {column: "Resistance", color: "#ef4444"}
    - {column: "Support", color: "#22c55e"}
  zoom: 252
  title: Support and Resistance Levels

get_pivot_points:
  chart: ta
  price: "EURUSD"
  price_name: EUR/USD
  overlays:
    - {column: "Resistance 2", color: "#ef4444", dashed: true, step: true}
    - {column: "Resistance 1", color: "#ef4444", step: true}
    - {column: "Pivot Point", color: "#f97316", step: true}
    - {column: "Support 1", color: "#22c55e", step: true}
    - {column: "Support 2", color: "#22c55e", dashed: true, step: true}
  zoom: 40
  title: Pivot Points

get_fibonacci_retracement_levels:
  chart: ta
  ticker: "BTCUSD"
  price: "BTCUSD"
  price_name: BTC/USD
  format: amount
  overlays:
    - {column: "0.0%", color: "#94a3b8"}
    - {column: "23.6%", color: "#38bdf8"}
    - {column: "38.2%", color: "#818cf8"}
    - {column: "50.0%", color: "#f97316"}
    - {column: "61.8%", color: "#a78bfa"}
    - {column: "78.6%", color: "#f472b6"}
    - {column: "100.0%", color: "#94a3b8"}
  zoom: 90
  title: Fibonacci Retracement Levels

get_relative_strength_index:
  chart: ta
  price: "BTCUSD"
  price_name: BTC/USD
  lower:
    series:
      - {column: "BTCUSD", name: "RSI", color: "#a78bfa"}
    levels: [30, 50, 70]
    min: 0
    max: 100
    format: number
  zoom: 252
  title: Relative Strength Index
  subtitle: Above 70 is usually read as overbought, below 30 as oversold

get_stochastic_oscillator:
  chart: ta
  ticker: "GBPUSD"
  price: "GBPUSD"
  price_name: GBP/USD
  lower:
    series:
      - {column: "Stochastic %K", color: "#38bdf8"}
      - {column: "Stochastic %D", color: "#f97316"}
    levels: [20, 80]
    min: 0
    max: 100
    format: number
  zoom: 126
  title: Stochastic Oscillator
  subtitle: Above 80 is usually read as overbought, below 20 as oversold

get_money_flow_index:
  chart: ta
  price: "^IXIC"
  price_name: Nasdaq Composite
  format: amount
  lower:
    series:
      - {column: "^IXIC", name: "MFI", color: "#a78bfa"}
    levels: [20, 80]
    min: 0
    max: 100
    format: number
  zoom: 252
  title: Money Flow Index
  subtitle: Above 80 is usually read as overbought, below 20 as oversold

get_williams_percent_r:
  chart: ta
  price: "EURUSD"
  price_name: EUR/USD
  lower:
    series:
      - {column: "EURUSD", name: "Williams %R", color: "#a78bfa"}
    levels: [-80, -20]
    min: -100
    max: 0
    format: number
  zoom: 252
  title: Williams %R
  subtitle: Above -20 is usually read as overbought, below -80 as oversold

get_commodity_channel_index:
  chart: ta
  price: "CLUSD"
  price_name: Crude oil
  lower:
    series:
      - {column: "CLUSD", name: "CCI", color: "#a78bfa"}
    levels: [-100, 0, 100]
    format: number
  zoom: 252
  title: Commodity Channel Index

get_ultimate_oscillator:
  chart: ta
  price: "^GDAXI"
  price_name: DAX
  format: amount
  lower:
    series:
      - {column: "^GDAXI", name: "Ultimate Oscillator", color: "#a78bfa"}
    levels: [30, 70]
    min: 0
    max: 100
    format: number
  zoom: 252
  title: Ultimate Oscillator

get_chande_momentum_oscillator:
  chart: ta
  price: "SIUSD"
  price_name: Silver
  lower:
    series:
      - {column: "SIUSD", name: "CMO", color: "#a78bfa"}
    levels: [-50, 0, 50]
    min: -100
    max: 100
    format: number
  zoom: 252
  title: Chande Momentum Oscillator

get_average_directional_index:
  chart: ta
  price: "USDJPY"
  price_name: USD/JPY
  lower:
    series:
      - {column: "USDJPY", name: "ADX", color: "#a78bfa"}
    levels: [25]
    min: 0
    format: number
  zoom: 252
  title: Average Directional Index
  subtitle: Above 25 is usually read as a trending market

get_choppiness_index:
  chart: ta
  price: "EURUSD"
  price_name: EUR/USD
  lower:
    series:
      - {column: "EURUSD", name: "Choppiness Index", color: "#a78bfa"}
    levels: [38.2, 61.8]
    min: 0
    max: 100
    format: number
  zoom: 252
  title: Choppiness Index
  subtitle: Above 61.8 is usually read as choppy, below 38.2 as trending

get_aroon_indicator:
  chart: ta
  ticker: "GCUSD"
  price: "GCUSD"
  price_name: Gold
  format: amount
  lower:
    series:
      - {column: "Aroon Up", color: "#22c55e"}
      - {column: "Aroon Down", color: "#ef4444"}
    levels: [50]
    min: 0
    max: 100
    format: number
  zoom: 252
  title: Aroon Indicator

get_vortex_indicator:
  chart: ta
