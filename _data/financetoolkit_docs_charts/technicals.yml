get_advancers_decliners:
  chart: ta
  derive:
    Net Advances: "f.drop(columns='Benchmark').sum(axis=1)"
    Advance-Decline Line: "f.drop(columns='Benchmark').sum(axis=1).cumsum()"
  overlays:
    - {column: Advance-Decline Line, color: "#38bdf8"}
  lower:
    series: [{column: Net Advances, bar: true, signed: true}]
    levels: [0]
    format: number
  format: number
  zoom: 252
  title: Advancers - Decliners
  subtitle: Ten iShares country ETFs counted as one market

get_trin:
