  zoom: 252
  title: New Highs - New Lows

# Collections, breadth, seasonality and signals
collect_all_indicators:
  chart: none
  title: All Technical Indicators
  reason: Dozens of indicators on different scales; each has its own page with its chart
collect_breadth_indicators:
  chart: none
  title: Breadth Indicators
  reason: Indicators on different scales; each has its own page with its chart
collect_momentum_indicators:
  chart: none
  title: Momentum Indicators
  reason: Indicators on different scales; each has its own page with its chart
collect_overlap_indicators:
  chart: none
  title: Overlap Indicators
  reason: Indicators on different scales; each has its own page with its chart
collect_volatility_indicators:
  chart: none
  title: Volatility Indicators
  reason: Indicators on different scales; each has its own page with its chart
get_volatility_cone:
  chart: line
  columns: [Max, 90th Percentile, Median, 10th Percentile, Min, Current]
  colors: {Current: "#facc15"}
  format: percent
  xname: Window (days)
  title: Volatility Cone
  subtitle: The range of realized volatility over each window, with the current reading
get_market_breadth:
  chart: ta
  overlays:
    - {column: Advance-Decline Line, color: "#38bdf8"}
  lower:
    series: [{column: Net Advances, bar: true, signed: true}]
    levels: [0]
    format: number
  format: number
  zoom: 252
  title: Market Breadth
  subtitle: The 30 members of the Dow Jones Industrial Average counted as one market
get_seasonality:
  chart: bar
  columns: [Average Return, Median Return]
  levels: [0]
  cards: false
  format: percent
  title: Seasonality
  subtitle: The return of each calendar month, averaged over the years of the example
get_relative_strength:
  chart: bar
  latest: true
  transpose: true
  levels: [80]
  cards: false
  format: number
  title: Relative Strength Rating
  subtitle: A 1 to 99 rank of each stock's weighted 12-month return on the last day; 80 and above is the usual cut-off for leaders
get_factor_analysis:
  chart: coef
  rows:
    - {"('get_rate_of_change', '1 Month')": "Rate of Change, 1 month ahead"}
    - {"('get_rate_of_change', '12 Months')": "Rate of Change, 12 months ahead"}
    - {"('get_moving_average', '1 Month')": "Distance from Average, 1 month ahead"}
    - {"('get_moving_average', '12 Months')": "Distance from Average, 12 months ahead"}
  derive:
    SE: f['Mean IC'] / f['t-Statistic']
  coef: Mean IC
  se: SE
  p: P-Value
  title: Information Coefficient
  subtitle: The mean rank correlation of each signal with the return that follows, with its 95% interval
get_candlestick_patterns:
  chart: none
  title: Candlestick Patterns
  reason: A pattern flag per day, read as a list of dates
get_signals:
  chart: none
  title: Signals
  reason: The days a crossover happened, read as a list of dates
get_indicator_summary:
  chart: none
  title: Indicator Summary
  reason: One reading per indicator on different scales

# Cycle, volume and trend indicators, and the labels and weights for machine learning
get_acceleration_bands:
  chart: ta
  price: "TSLA"
  price_name: Tesla
  overlays:
    - {column: "Upper Band", color: "#818cf8"}
    - {column: "Middle Band", color: "#f97316", dashed: true}
    - {column: "Lower Band", color: "#818cf8"}
  fill: [Upper Band, Lower Band]
  zoom: 252
  title: Acceleration Bands

get_adaptive_price_zone:
  chart: ta
  price: "QQQ"
  price_name: QQQ
  overlays:
    - {column: "Upper Band", color: "#818cf8"}
    - {column: "Middle Band", color: "#f97316", dashed: true}
    - {column: "Lower Band", color: "#818cf8"}
  fill: [Upper Band, Lower Band]
  zoom: 252
  title: Adaptive Price Zone

get_holt_winters_channel:
  chart: ta
  price: "GOOGL"
  price_name: Alphabet
  overlays:
    - {column: "Upper Band", color: "#818cf8"}
    - {column: "Middle Band", color: "#f97316", dashed: true}
    - {column: "Lower Band", color: "#818cf8"}
  fill: [Upper Band, Lower Band]
  zoom: 252
  title: Holt-Winters Channel

get_standard_deviation_channel:
  chart: ta
  price: "AAPL"
  price_name: Apple
  overlays:
    - {column: "Upper Band 2", color: "#818cf8", dashed: true}
    - {column: "Upper Band 1", color: "#818cf8"}
    - {column: "Linear Regression", color: "#f97316"}
    - {column: "Lower Band 1", color: "#818cf8"}
    - {column: "Lower Band 2", color: "#818cf8", dashed: true}
  fill: [Upper Band 1, Lower Band 1]
  zoom: 252
  title: Standard Deviation Channel
  subtitle: A linear regression line fitted over the whole period with bands one and two standard deviations away

get_chande_kroll_stop:
  chart: ta
  price: "META"
  price_name: Meta
  overlays:
    - {column: "High Stop", color: "#ef4444"}
    - {column: "Low Stop", color: "#22c55e"}
