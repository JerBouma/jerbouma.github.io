    - {column: "Uptrend", color: "#22c55e"}
    - {column: "Downtrend", color: "#ef4444"}
  zoom: 252
  title: Gann HiLo Activator

get_guppy_multiple_moving_averages:
  chart: ta
  chart_expr: "guppy.xs('AAPL', level=1, axis='columns')"
  price: "AAPL"
  price_name: Apple
  overlays:
    - {column: "Short EMA 3", color: "#38bdf8"}
    - {column: "Short EMA 5", color: "#38bdf8"}
    - {column: "Short EMA 8", color: "#38bdf8"}
    - {column: "Short EMA 10", color: "#38bdf8"}
    - {column: "Short EMA 12", color: "#38bdf8"}
    - {column: "Short EMA 15", color: "#38bdf8"}
    - {column: "Long EMA 30", color: "#f97316"}
    - {column: "Long EMA 35", color: "#f97316"}
    - {column: "Long EMA 40", color: "#f97316"}
    - {column: "Long EMA 45", color: "#f97316"}
    - {column: "Long EMA 50", color: "#f97316"}
    - {column: "Long EMA 60", color: "#f97316"}
  zoom: 252
  title: Guppy Multiple Moving Averages
  subtitle: The short group (blue) follows the traders, the long group (orange) the investors

get_heikin_ashi:
