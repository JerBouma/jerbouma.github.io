# Regressions as coefficient plots (95% interval, intercept left out as coefplot does),
# tests as the statistic against its 5% critical value, forecasts and responses over
# the horizon. Tests that return one statistic for one model have no chart.

get_iv_2sls:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: IV (2SLS) Coefficient
  subtitle: Second-stage estimate with its 95% confidence interval

get_difference_in_differences:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: Difference-in-Differences Coefficients
  subtitle: Treated x Post is the treatment effect; bars show the 95% confidence interval

get_regression_discontinuity:
  chart: none
  reason: One estimate with its test statistics; the usual binned scatter needs the observations, which the result does not hold

get_propensity_score_matching:
  chart: none
  reason: One treatment effect with its test statistics and sample counts

get_synthetic_control:
  chart: none
  reason: Summary statistics of the fit; the usual treated-versus-synthetic path is not part of the result

get_event_study:
  chart: none
  reason: One cumulative abnormal return with its test and market model; the abnormal return path is not part of the result

get_arch_lm_test:
  chart: bar
  transpose: true
  derive:
    Critical Value 5%: "11.0705"
  columns: [ARCH-LM Statistic, Critical Value 5%]
  format: number
  title: ARCH-LM Statistic
  subtitle: Against the 5% critical value of a chi-squared with 5 lags; above it, volatility clusters

get_jarque_bera_test:
  chart: bar
  transpose: true
  derive:
    Critical Value 5%: "5.9915"
  columns: [Jarque-Bera Statistic, Critical Value 5%]
  format: ratio
  title: Jarque-Bera Statistic
  subtitle: Against the 5% critical value of a chi-squared with 2 degrees of freedom; above it, returns are not normal

get_ljung_box_test:
  chart: bar
  transpose: true
  derive:
    Critical Value 5%: "18.307"
  columns: [Ljung-Box Statistic, Critical Value 5%]
  format: number
  title: Ljung-Box Statistic
  subtitle: Against the 5% critical value of a chi-squared with 10 lags; above it, returns are autocorrelated

get_variance_ratio_test:
  chart: bar
  transpose: true
  columns: [Variance Ratio]
  levels: [1]
  cards: false
  format: ratio
  title: Variance Ratio
  subtitle: 1 is a random walk; above 1 returns trend, below 1 they revert

get_cusum_test:
  chart: bar
  transpose: true
  columns: [CUSUM Statistic, Critical Value 5%]
  format: ratio
  title: CUSUM Statistic
  subtitle: Against the 5% critical value; above it, the parameters are not stable

get_markov_regime_switching:
  chart: tabs
  title: Markov Regime Switching
  tabs:
    - label: Volatility per Regime
      chart: bar
      transpose: true
      columns: [{Regime 1 Volatility: Regime 1}, {Regime 2 Volatility: Regime 2}]
      format: percent
      subtitle: Standard deviation of weekly returns in each regime
    - label: Mean per Regime
      chart: bar
      transpose: true
      columns: [{Regime 1 Mean: Regime 1}, {Regime 2 Mean: Regime 2}]
      format: percent
      subtitle: Average weekly return in each regime
    - label: Expected Duration
      chart: bar
      transpose: true
      columns: [{Regime 1 Expected Duration: Regime 1}, {Regime 2 Expected Duration: Regime 2}]
      format: number
      subtitle: Weeks a regime is expected to last once entered

get_structural_breaks:
  chart: bar
  ticker: United States
  level: 0
  x: Start
  columns: [Mean]
  format: percent
  title: Mean per Regime
  subtitle: Average inflation rate between the breaks, by the year each regime starts

get_time_varying_beta:
  chart: line
  levels: [1]
  format: ratio
  title: Rolling Beta
  subtitle: Against the Benchmark; 1 moves one for one with the market

get_dcc_garch:
  chart: line
  expr: correlations
  levels: [0]
  format: ratio
  title: DCC-GARCH Conditional Correlation
  subtitle: Daily correlation of each pair of returns

get_pairs_trading:
  chart: none
  reason: One pair's hedge ratio and test statistics in a single row

get_diebold_mariano_test:
  chart: bar
  transpose: true
  columns: [Diebold-Mariano Statistic]
  levels: [-1.96, 1.96]
  cards: false
  format: ratio
  title: Diebold-Mariano Statistic
  subtitle: Beyond the dashed lines the accuracy differs at the 5% level; negative favours the EWMA forecast

get_arima_forecast:
  chart: line
  format: price
  xname: Step
  title: ARIMA Forecast
  subtitle: Gold price, the steps ahead of the last close

get_var_forecast:
  chart: line
  format: number
  xname: Step
  title: VAR Forecast
  subtitle: VIX and 3-month VIX, the steps ahead of the last close

get_impulse_response_function:
  chart: tabs
  title: Impulse Response Function
  tabs:
    - label: Shock to ^VIX
      chart: line
      ticker: ^VIX
      level: 0
      levels: [0]
      format: ratio
      xname: Horizon
      subtitle: Response of each index to a one standard deviation shock to the VIX
    - label: Shock to ^OVX
      chart: line
      ticker: ^OVX
      level: 0
      levels: [0]
      format: ratio
      xname: Horizon
      subtitle: Response of each index to a one standard deviation shock to the OVX

get_variance_decomposition:
  chart: tabs
  title: Forecast Error Variance Decomposition
  tabs:
    - label: ^VIX
      chart: bar
      stack: true
      ticker: ^VIX
      level: 0
      format: percent
      xname: Horizon
      subtitle: Share of the VIX forecast error variance due to each shock
    - label: ^GVZ
      chart: bar
      stack: true
      ticker: ^GVZ
      level: 0
      format: percent
      xname: Horizon
      subtitle: Share of the gold volatility index forecast error variance due to each shock

get_vecm_forecast:
  chart: line
  format: price
  xname: Step
  title: VECM Forecast
  subtitle: The two Alphabet share classes, the steps ahead of the last close

get_rmse:
  chart: bar
  columns: [RMSE]
  sort: asc
  format: percent
  title: Root Mean Squared Error
  subtitle: Between the daily returns of each pair

get_mae:
  chart: bar
  columns: [MAE]
  sort: asc
  format: percent
  title: Mean Absolute Error
  subtitle: Between the daily returns of each pair

get_out_of_sample_validation:
  chart: none
  reason: Errors in each asset's own price units, so the bars would not compare

get_ols:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: OLS Coefficients
  subtitle: Estimates with their 95% confidence interval

get_wls:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: WLS Coefficient
  subtitle: Estimate with its 95% confidence interval

get_gls:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: GLS Coefficient
  subtitle: Estimate with its 95% confidence interval

get_logistic_regression:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: number
  title: Logistic Regression Coefficient
  subtitle: Log-odds of an up day per unit of return, with its 95% confidence interval

get_probit_regression:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: number
  title: Probit Regression Coefficient
  subtitle: Estimate with its 95% confidence interval

get_quantile_regression:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  derive:
    P-Value: "(f['Coefficient'] / f['Std. Error']).abs().div(2 ** 0.5).map(__import__('math').erfc)"
  format: ratio
  title: Quantile Regression Coefficients
  subtitle: At the 5% quantile, with their 95% confidence interval

get_fama_macbeth_regression:
  chart: coef
  coef: Risk Premium
  se: Std. Error
  p: P-Value
  format: percent
  title: Fama-MacBeth Risk Premia
  subtitle: Monthly premium per factor with its 95% confidence interval; the intercept is the pricing error

get_fixed_effects:
  chart: tabs
  title: Fixed Effects
  tabs:
    - label: Coefficient
      chart: coef
      coef: Coefficient
      se: Std. Error
      p: P-Value
      rows: [Benchmark]
      format: ratio
      subtitle: Estimate with its 95% confidence interval
    - label: Entity Effects
      chart: bar
      rows:
        - {"Entity Effect: XOM": XOM}
        - {"Entity Effect: CVX": CVX}
        - {"Entity Effect: SHEL": SHEL}
        - {"Entity Effect: BP": BP}
        - {"Entity Effect: TTE": TTE}
      columns: [Coefficient]
      sort: desc
      format: percent
      subtitle: Each company's own intercept, its average daily return beyond the Benchmark

get_random_effects:
  chart: coef
  coef: Coefficient
  se: Std. Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: Random Effects Coefficient
  subtitle: Estimate with its 95% confidence interval

