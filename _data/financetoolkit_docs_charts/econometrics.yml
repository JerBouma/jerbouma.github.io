# Regressions as coefficient plots (95% interval, intercept left out as coefplot does),
# tests as the statistic against its 5% critical value, forecasts and responses over
# the horizon. Tests that return one statistic for one model have no chart.

get_iv_2sls:
  chart: coef
  coef: Coefficient
  se: Standard Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: IV (2SLS) Coefficient
  subtitle: Second-stage estimate with its 95% confidence interval

get_difference_in_differences:
  chart: coef
  coef: Coefficient
  se: Standard Error
  p: P-Value
  drop: [Intercept]
  format: ratio
  title: Difference-in-Differences Coefficients
  subtitle: Treated x Post is the treatment effect; bars show the 95% confidence interval

get_regression_discontinuity:
  chart: none
  reason: One estimate with its test statistics; the usual binned scatter needs the observations, which the result does not hold

get_propensity_score_matching:
  chart: none
  reason: One treatment effect with its test statistics and sample counts

get_synthetic_control:
  chart: none
  reason: Summary statistics of the fit; the usual treated-versus-synthetic path is not part of the result

get_event_study:
  chart: none
  reason: One cumulative abnormal return with its test and market model; the abnormal return path is not part of the result

get_arch_lm_test:
  chart: bar
  transpose: true
  derive:
    Critical Value 5%: "11.0705"
  columns: [ARCH-LM Statistic, Critical Value 5%]
  format: number
  title: ARCH-LM Statistic
  subtitle: Against the 5% critical value of a chi-squared with 5 lags; above it, volatility clusters

get_jarque_bera_test:
  chart: bar
  transpose: true
  derive:
    Critical Value 5%: "5.9915"
  columns: [Jarque-Bera Statistic, Critical Value 5%]
  format: ratio
  title: Jarque-Bera Statistic
  subtitle: Against the 5% critical value of a chi-squared with 2 degrees of freedom; above it, returns are not normal

get_ljung_box_test:
  chart: bar
  transpose: true
  derive:
    Critical Value 5%: "18.307"
  columns: [Ljung-Box Statistic, Critical Value 5%]
  format: number
  title: Ljung-Box Statistic
  subtitle: Against the 5% critical value of a chi-squared with 10 lags; above it, returns are autocorrelated

get_variance_ratio_test:
  chart: bar
  transpose: true
  columns: [Variance Ratio]
  levels: [1]
  cards: false
  format: ratio
  title: Variance Ratio
  subtitle: 1 is a random walk; above 1 returns trend, below 1 they revert

get_cusum_test:
  chart: bar
  transpose: true
  columns: [CUSUM Statistic, Critical Value 5%]
  format: ratio
  title: CUSUM Statistic
  subtitle: Against the 5% critical value; above it, the parameters are not stable

get_markov_regime_switching:
  chart: tabs
  title: Markov Regime Switching
  tabs:
    - label: Volatility per Regime
      chart: bar
      transpose: true
      columns: [{Regime 1 Volatility: Regime 1}, {Regime 2 Volatility: Regime 2}]
      format: percent
      subtitle: Standard deviation of weekly returns in each regime
    - label: Mean per Regime
      chart: bar
      transpose: true
      columns: [{Regime 1 Mean: Regime 1}, {Regime 2 Mean: Regime 2}]
      format: percent
      subtitle: Average weekly return in each regime
    - label: Expected Duration
      chart: bar
      transpose: true
      columns: [{Regime 1 Expected Duration: Regime 1}, {Regime 2 Expected Duration: Regime 2}]
      format: number
      subtitle: Weeks a regime is expected to last once entered

get_structural_breaks:
  chart: bar
  ticker: United States
  level: 0
  x: Start
  columns: [Mean]
  format: percent
  title: Mean per Regime
  subtitle: Average inflation rate between the breaks, by the year each regime starts

get_time_varying_beta:
  chart: line
  levels: [1]
  format: ratio
  title: Rolling Beta
  subtitle: Against the Benchmark; 1 moves one for one with the market

get_dcc_garch:
  chart: line
  expr: correlations
  levels: [0]
  format: ratio
  title: DCC-GARCH Conditional Correlation
  subtitle: Daily correlation of each pair of returns

get_pairs_trading:
  chart: none
  reason: One pair's hedge ratio and test statistics in a single row

get_diebold_mariano_test:
  chart: bar
  transpose: true
