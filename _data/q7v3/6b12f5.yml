linkedin:
  text: |
    A 16-day Apple call with a $190 strike, priced on 7 February 2024: binomial tree $4.32, Black-Scholes $4.33, market $2.67.

    Two models agreeing to the cent looks like strong evidence that the market is off. It is weaker evidence than it looks.

    Both models were fed the same inputs, and the one that matters most for a short-dated, at-the-money option is volatility. They used 28.26%, estimated from 11 years of Apple's price history. The market quoted that same contract at 23.83% implied volatility.

    A binomial tree converges to Black-Scholes for a European option as you add steps. So the agreement mainly tells you the tree is built correctly. It says very little about whether 28% is the right volatility for the next two weeks, which is exactly the question the market price is answering.

    What I take from it: when a model disagrees with the market, compare the inputs before you compare the prices. Usually the gap is an assumption you can name, and then the discussion becomes about that assumption rather than about who is "wrong".

    I wrote up how binomial trees work, from the up and down factors to risk-neutral probabilities and early exercise for American options, with the Python in the Finance Toolkit, which I built and maintain:
    https://www.jeroenbouma.com/articles/binomial-trees

    Not investment advice.

    #OptionsPricing #QuantFinance #Derivatives
