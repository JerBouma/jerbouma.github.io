linkedin:
  text: |
    Microsoft spent $64.6 billion on capital expenditure in fiscal 2025. In 2015 that was $5.9 billion.

    Free cash flow was still $71.6 billion, but that jump changes how its valuation multiples read.

    I went through 40 years of Microsoft's financials with the Finance Toolkit, the open-source Python library I built. The capex line is the clearest break with its past.

    For most of its history Microsoft was a licensing business. Gross margins peaked near 90% in the mid-1990s, because distributing another copy of Windows cost almost nothing. Cloud, hardware and data centres changed that cost structure: gross margin was 64.7% by 2015. Net margin has since recovered to 36.2%, approaching the levels of 2000.

    The new capex is mostly AI infrastructure, and it shows in the multiples. For 2025 the stock traded at 35.5x earnings but 50.4x free cash flow. Earnings spread the cost of a data-centre build-out over years of depreciation; free cash flow takes it up front.

    If that spending turns into Azure revenue over the next three to five years, normalised free cash flow looks better than the headline ratio suggests. If it doesn't, the multiple is optimistic.

    The lesson I'd apply to any company in a heavy investment cycle: read P/FCF next to the capex trend, never on its own.

    The full analysis, with the Python code and prompts to reproduce it:
    https://www.jeroenbouma.com/articles/microsoft-financial-history-finance-toolkit

    Not investment advice.

    #FundamentalAnalysis #Valuation #Python
