linkedin:
  text: |
    Ask an AI assistant which uranium ETFs you can buy and you will probably hear URA and URNM, the two best-known US funds.

    The Finance Database lists 21 uranium ETF listings from ten issuers across eight markets. Seven of them are UCITS versions in London, Frankfurt and Milan, which for many European investors are the only ones they can buy.

    That gap is typical. Language models reason well about companies, but they list them from memory, and memory favors the famous names and the US tickers. Ask for every large European chipmaker and you get ASML, rarely the seven companies and 18 European listings that are actually there. Ask which ticker belongs to Apple's ISIN and the answer is AAPL, while the share trades under 19 tickers on 15 exchanges in 6 currencies.

    So I gave the assistant the database instead. The Finance Database MCP server lets Claude, ChatGPT or Cursor search 300,000+ equities, ETFs, funds, indices and currencies by sector, country, exchange, issuer or ISIN. It is free and hosted, and it needs no API key: add one URL as a connector and ask.

    Finding the universe is the first step of most research. The article has eight real questions with their answers, and how the list then feeds into the analysis:
    https://www.jeroenbouma.com/articles/find-stocks-etfs-funds-with-claude

    I maintain the Finance Database and built the server. Not investment advice.

    #ETFs #AIinFinance #InvestmentResearch
