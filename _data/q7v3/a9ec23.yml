written: 2026-10-14
linkedin:
  text: |
    On 6 May 2023, Microsoft's P/E ratio was 28.93 on Stockopedia and 34.4 on Companies Market Cap. Three other sites reported something in between. All five were "correct."

    They used different earnings definitions, share counts and rounding, and none of them published the formula.

    Put an AI assistant on top of that and the problem doesn't go away. Ask it for a P/E and it picks one of those numbers from a web search, recalls one from its training data, or makes one up when it finds nothing.

    That's why I built an MCP server for the Finance Toolkit, the open-source Python library I maintain. It's hosted at one URL: add it as a connector in Claude, ChatGPT, Copilot or Cursor, enter your data key once, and the assistant calculates the number instead of recalling it. 500+ documented methods: ratios, valuation, risk, factor models, technicals and macro data.

    One example from the article: in 2025 the US five-factor Fama-French model explained between 16% and 41% of the daily return variance of eight US-listed South American stocks. For most of them, the bigger part of the story is local: currencies, rates, commodities and politics. A beta on its own would never show you that.

    **Don't let a language model compute a financial number. Let it call one, from a formula you can audit.**

    Four worked questions, with every tool call:
    https://www.jeroenbouma.com/articles/introducing-the-finance-toolkit-mcp-server

    Not investment advice.

    #QuantFinance #AIinFinance #OpenSource
reddit:
  - subreddit: r/mcp
    title: I built a hosted MCP server that gives AI assistants 500+ auditable financial calculations instead of web-scraped numbers
    body: |
      On 6 May 2023, Microsoft's P/E ratio was 28.93 on Stockopedia, 32.05 on Morningstar, 32.66 on Macrotrends, 33.67 on the Wall Street Journal and 34.4 on Companies Market Cap. Different earnings definitions, share counts and rounding, and no published formulas. An assistant that answers finance questions through web search inherits all of that, and when it can't find a number it tends to invent one.

      I'm the author of the Finance Toolkit, an open-source Python library where every ratio, indicator and model is plain code you can audit. The MCP server exposes the same engine to any MCP client.

      **What it does**

      - 500+ methods grouped into 22 categorical tools (profitability, valuation, solvency, liquidity, efficiency, models, performance, risk, econometrics, options, momentum, overlap, volatility, breadth, macro, rates, fixed income and more), plus 3 search tools that help the model find the right indicator.
      - Each tool takes an `indicator` parameter, e.g. `valuation` with `indicator='get_price_to_earnings_ratio'`. You never name one yourself; the assistant picks it from your question.
      - Company data comes from Financial Modeling Prep; macro data from the OECD and the Global Macro Database.

      **Setup**

      Hosted: add `https://financetoolkit.jeroenbouma.com/mcp` as a custom connector (Claude, ChatGPT developer mode, VS Code, Cursor, Windsurf, Codex, Gemini CLI). An OAuth page asks for your FMP API key on first use.

      Local, if you prefer to run it yourself:

          uvx --from "financetoolkit[mcp]" financetoolkit-mcp-setup

      That writes the config for Claude Desktop, Claude Code, VS Code, Cursor, Windsurf or Gemini. There's also an MCPB bundle for Claude Desktop on the latest GitHub release.

      **Design choices and trade-offs**

      - Grouping 500+ methods into 22 tools keeps the tool list short enough for smaller models to choose from; the search tools cover the rest.
      - The server returns the same numbers to every model. A larger model mostly adds follow-up calculations and caveats.
      - Answers carry notes on what was converted or aligned, e.g. fiscal years mapped to calendar years and foreign statements converted to the currency of the share price.

      **Limitations**

      - Company data needs an FMP API key. The free plan covers five years of history and 250 requests a day.
      - The numbers are only as good as the filings and the provider. The difference is that the formula on top is visible.

      The article works through four questions with every tool call listed: semiconductor valuations, European sector ETFs through the 2020 crash, Fama-French on South American stocks and Asia's investment-to-GDP ratios: https://www.jeroenbouma.com/articles/introducing-the-finance-toolkit-mcp-server

      Code: https://github.com/JerBouma/FinanceToolkit

      Happy to answer questions, and criticism of the tool design is welcome.
  - subreddit: r/financialmodelling
    title: "Fama-French five-factor on South American stocks: the US factors explain less than you'd think"
    body: |
      I ran a five-factor Fama-French regression (Mkt-RF, SMB, HML, RMW, CMA) on eight US-listed South American names, one regression per calendar year on daily excess returns, using the US factors from Kenneth French's data library. The R-squared turned out to be the most interesting column.

      **What stands out**

      - In 2025 the R-squared ranged from 0.16 for Itaú to 0.41 for Southern Copper. For every one of the eight, more than half of the daily return variance comes from something the US factors don't capture: currencies, local rates, commodity prices, politics.
      - MercadoLibre was the exception early on, at 0.69 in 2022, when it traded like a US growth stock, before dropping to 0.12 in 2024. Its profitability (RMW) loading was negative in every year from 2021 to 2025 (−1.11 in 2025): its returns moved like those of less profitable, growth-style companies.
      - Petrobras carried a value (HML) tilt in every year, between 0.13 and 1.14.
      - In 2026 so far, the oil names decoupled from the US market: market loadings of −0.30 for Petrobras and −0.11 for YPF, with an R-squared of 0.06 and 0.11, while Southern Copper's market loading rose to 2.15.

      The practical point: R-squared tells you how much to trust the rest of the row. A beta for these names on its own hides that the model explains a minority of the return.

      **Caveats**

      - These are US factors applied to US-listed tickers of South American companies. Regional or emerging-market factors could give a different picture.
      - Each year is a separate regression on daily observations, so the coefficients are on a daily scale. The 2026 regressions cover the year so far, as far as the French data library has been updated.
      - Eight stocks is an illustration, not a study.

      **Reproduce it**

      Calculated with the Finance Toolkit, an open-source Python library I maintain:

          from financetoolkit import Toolkit

          south_america = Toolkit(
              tickers=["PBR", "YPF", "VALE", "SCCO", "ITUB", "CIB", "MELI", "GGB"],
              api_key="FINANCIAL_MODELING_PREP_KEY",
              start_date="2021-01-01",
          )
          fama_french = south_america.performance.get_fama_and_french_model(period="yearly")

      The article this comes from asks the same question through the Toolkit's MCP server, with charts of the loadings and R-squared over time, plus three other examples: https://www.jeroenbouma.com/articles/introducing-the-finance-toolkit-mcp-server

      Curious whether people here use regional factors for LatAm names, and which ones.

      Not investment advice.
