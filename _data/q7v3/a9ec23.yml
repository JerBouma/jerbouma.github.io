# Drafts for Introducing the Finance Toolkit MCP Server. Starting points, edited before posting.
article: /articles/introducing-the-finance-toolkit-mcp-server
written: 2026-10-02
linkedin:
  text: |
    On 6 May 2023, Microsoft's P/E ratio was 28.93 on Stockopedia and 34.4 on Companies Market Cap. Three other sites reported something in between. All five were "correct."

    They used different earnings definitions, share counts and rounding, and none of them published the formula.

    Now put an AI assistant on top of that. Ask it for a P/E and it searches the web, picks one of those numbers, or makes one up when it can't find any. The inconsistency doesn't go away. It just becomes invisible.

    That's why I built an MCP server for the Finance Toolkit, the open-source Python library I maintain. It gives assistants like Claude, Copilot, Cursor and Gemini direct access to the same 500+ methods: ratios, WACC, DuPont, Altman Z-Score, Piotroski F-Score, technical indicators, Fama-French and macro data. The assistant picks the calculation; the number comes from code you can read on GitHub.

    One example from the article: a five-factor Fama-French regression explained 61.9% of MercadoLibre's return variance in 2021 and 12.2% in 2025. A beta on its own would never show you that drift.

    **Don't let a language model compute a financial number. Let it call one, from a formula you can audit.**

    Full walkthrough, with the one-command setup:
    https://www.jeroenbouma.com/articles/introducing-the-finance-toolkit-mcp-server

    Not investment advice.

    #QuantFinance #AIinFinance #OpenSource
