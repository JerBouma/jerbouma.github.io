# Drafts for Tracking Macroeconomic Indicators with the Finance Toolkit. Starting points, edited before posting.
article: /articles/macroeconomic-indicators-finance-toolkit
written: 2026-10-02
linkedin:
  text: |
    In 2022, Brazil's central bank had its policy rate at 13.75%. The Bank of Japan's was -0.1%. Same global inflation shock, almost opposite responses.

    I compared five economies (the US, UK, Germany, Japan and Brazil) on inflation, policy rates, unemployment and government debt from 2019 onwards. What stood out:

    Brazil moved a year early. Inflation hit 8.3% in 2021 while the US was at 4.7%, and the central bank took its rate from 2.0% to 13.75% in eighteen months. By the time the Fed and the Bank of England started in 2022, Brazil was close to its peak.

    High rates did not stop Brazil's labour market from healing. Unemployment fell every year from 2020, from 13.8% to 7.2% by 2025.

    In the US, rates rose nearly five points and unemployment barely moved after reaching 3.6% in 2022.

    Japan held at -0.10% through the whole shock, with inflation never above 3.3%, and carries a debt-to-GDP ratio of roughly 249%. Near-zero rates keep that affordable.

    **There was one global shock, but no single global cycle.** Each economy is unwinding it on its own schedule, set by its starting debt, its central bank's tolerance for inflation and the structure of its labour market.

    The data comes from the OECD and the Global Macro Database, through the Economics module of the Finance Toolkit, the open-source library I built. No API key needed.

    Full article, with charts:
    https://www.jeroenbouma.com/articles/macroeconomic-indicators-finance-toolkit

    #Macroeconomics #MonetaryPolicy #CentralBanks
