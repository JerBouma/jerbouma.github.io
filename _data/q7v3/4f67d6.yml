linkedin:
  text: |
    A standard levered DCF put Axon Enterprise at $94.30 a share. The stock was trading at $510.28 that day.

    I wouldn't read that as the market being wrong. A WACC-and-terminal-growth template can't capture a company compounding revenue at 30%+, so the bull case rests on assumptions the template doesn't make for you. What the exercise does show is how much of the investment case is judgment rather than arithmetic.

    The analyst estimates point the same way. For 2028, the analysts covering AXON put net income anywhere between $573 million and $1.81 billion, a range wider than the company's entire 2025 net income. They agree on revenue and disagree on margins, and that spread says more than the $658.56 consensus target.

    I ran this diligence pass (key metrics, estimates, DCF, the latest earnings call, insider trades, 13F flows) as a conversation in Claude Desktop with the FMP MCP server. The article is written for family offices and small funds that hold a handful of names without a research desk. In a concentrated book there is no long tail to absorb a mistake, so the mechanical work should be cheap and the judgment should stay with you.

    It also covers where the Finance Toolkit MCP server I built adds computed analysis on top of FMP's data.

    Not investment advice; AXON is only the worked example.

    https://www.jeroenbouma.com/articles/equity-research-family-offices-fmp-mcp

