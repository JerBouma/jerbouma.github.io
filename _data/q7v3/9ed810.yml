# Drafts for "The Black Death's Economic Effects on English Wages". Starting points, edited before posting.
article: /articles/black-death-economic-effects
written: 2026-11-17
linkedin:
  text: |
    In 1348, England had about 4.81 million people. By 1351, after the Black Death, it had 2.60 million: a fall of 46% in three years, the largest in the Bank of England's record of the English economy, which goes back to 1086.

    Over the next century, the real wage of an ordinary worker roughly doubled. Taking 1340 to 1347 as 100, it averaged 193 in the first half of the 15th century and 201 in the second half.

    The land and the tools were still there, with far fewer people to work them, so each worker produced more: real GDP per head rose to 138 while the economy as a whole shrank by about 40%. The Crown tried to cap wages at their pre-plague level with the Statute of Labourers in 1351. Earnings per head still more than doubled, while prices ended only slightly higher.

    What I find most interesting is how long it lasted, and how it ended. Wages stayed high for as long as the population stayed low. Once it grew again in the 1500s, the real wage fell back to its pre-plague level by the early 1600s, and did not reach its late 15th century level again until 1865.

    This is the first article in a weekly series on events from economic history, all charted with data from the Finance Toolkit, which I built and maintain.

    https://www.jeroenbouma.com/articles/black-death-economic-effects

    #EconomicHistory #Macroeconomics #LabourMarkets
