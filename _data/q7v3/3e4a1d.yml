# Drafts for Screening for Undervalued Stocks with the Finance Toolkit. Starting points, edited before posting.
article: /articles/screening-undervalued-stocks-finance-toolkit
written: 2026-10-02
linkedin:
  text: |
    Five of 15 large caps passed a simple value screen: P/E below 20x and EV/EBITDA below 18x. Only two of them also earned more than 25% on invested capital.

    On 2025 annual figures across five sectors, Bank of America, Johnson & Johnson, Merck, Pfizer and ExxonMobil pass both. Requiring two metrics matters: sorted on P/E alone, Intel came out on top, only because a net loss makes its P/E negative.

    Cheap is not the same as undervalued. Low multiples often price in falling earnings, the classic value trap. So the second pass checks quality: ROE, ROIC and gross margin.

    That is where the five separate. J&J (33.0% ROIC) and Merck (28.1%) both have gross margins above 71%; their discount comes from litigation and patent-cliff concerns rather than a weakening business. ExxonMobil earns 14.8% with cyclical risk. Pfizer, at 11.3%, is borderline after its COVID vaccine revenue ran off. Bank of America drops out at 4.8% ROIC, which says more about the metric than the bank: for a deposit-funded balance sheet, ROE (9.7%) is the better lens.

    The output of a screen is a watchlist, not a buy list. Its value is ruling out the 11 names that don't justify a closer look. It can't see what trailing numbers miss, like Merck's Keytruda patent cliff.

    Full walkthrough with the Python code, using the Finance Toolkit (the open-source library I built):
    https://www.jeroenbouma.com/articles/screening-undervalued-stocks-finance-toolkit

    Not investment advice.

