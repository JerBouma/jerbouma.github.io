    title: "Intel vs AMD and NVIDIA vs AMD: 15 years of revenue, margins and ROIC for the two real rivalries in semis"
    body: |
      I compared six chipmakers (Intel, AMD, NVIDIA, Qualcomm, Broadcom, TI) on fifteen years of financials and found that "the semiconductor sector" is not one competitive arena. TI is analog for industrial and auto, Qualcomm is ARM mobile, Broadcom is networking and storage. The direct contests are two pairs, and AMD is in both.

      **Intel vs AMD (x86 CPUs)**

      | | 2010 | 2020 | 2025 |
      |---|---:|---:|---:|
      | Intel revenue | $43.6bn | $77.9bn | $52.9bn |
      | AMD revenue | $6.5bn | $9.8bn | $34.6bn |
      | Intel gross margin | 66.1% | 56.0% | 34.8% |
      | AMD gross margin | 45.6% | 44.5% | 49.5% |

      - Intel dominated every metric through 2017, while AMD lost money and its gross margin fell below 30% in 2015-2016.
      - Zen (2017) shows up in the numbers with a lag: AMD's revenue only broke meaningfully higher in 2021-2022.
      - AMD's gross margin passed Intel's in 2022. That's mostly a manufacturing story: AMD is fabless on TSMC's nodes, while Intel's own fabs fell one and then two generations behind.
      - Intel's ROIC turned negative in 2024 and stayed slightly below zero in 2025.

      **NVIDIA vs AMD (GPUs and AI accelerators)**

      - In 2020 AMD actually had the higher ROIC: 50.2% vs NVIDIA's 24.3%.
      - From 2021 the lines separate. NVIDIA's revenue went from $26.9bn in 2022 to $130.5bn in 2025.
      - In 2025 NVIDIA's ROIC was 102.6% against AMD's 6.8%. Part of AMD's low figure is the ~$35bn Xilinx deal inflating invested capital, but most of the gap is CUDA vs ROCm: a software ecosystem built over fifteen years that is hard to catch up with.

      My read: AMD beat Intel on engineering execution. Catching NVIDIA is a developer adoption problem, which is slower and more expensive to solve.

      **Valuation snapshot (2025):** AMD at 80.8x P/E trades above NVIDIA's 63.5x despite the much lower ROIC, so the market is pricing in a substantial ROIC recovery. Intel has no meaningful P/E because of losses and sits at 19.1x EV/EBITDA.

      Caveats: annual FMP data, fiscal years as reported, multiples have moved since. Disclosure: I built the open-source Python library I used for this (Finance Toolkit). Full write-up with code and charts: https://www.jeroenbouma.com/articles/semiconductor-sector-analysis-finance-toolkit

      Not investment advice.
