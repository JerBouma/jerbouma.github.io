    title: "Semiconductors 2010-2025: gross margins split along the fab/fabless line, and ROIC followed"
    body: |
      **TL;DR:** Across Intel, AMD, NVIDIA, Qualcomm, Broadcom and TI, the biggest shift of the last fifteen years is in gross margin, and it follows manufacturing rather than product: Intel went from 66% to 34.8%, NVIDIA from 35.4% to 75.0%. In 2025 NVIDIA earned a 102.6% ROIC against 6.8% for AMD, and Intel's ROIC turned negative in 2024.

      I pulled annual statements for the six companies from 2010 to 2025 and looked at revenue, gross margin and ROIC, then at current multiples.

      **Revenue and gross margin, 2010 vs 2025**

      | | Revenue 2010 | Revenue 2025 | Gross margin 2010 | Gross margin 2025 |
      |---|---:|---:|---:|---:|
      | Intel | $43.6bn | $52.9bn | 66.1% | 34.8% |
      | AMD | $6.5bn | $34.6bn | 45.6% | 49.5% |
      | NVIDIA | $3.3bn | $130.5bn | 35.4% | 75.0% |

      **Margins follow the fabs.** Intel designs and fabricates its own chips. Once its process technology fell behind TSMC's, first by one node and then by two, its cost per chip rose with every product cycle, while fabless competitors bought access to better nodes at lower cost. AMD's gross margin bottomed below 30% in 2015-2016 and crossed above Intel's in 2022 (44.9% vs 42.6%). That crossover says more about manufacturing than about Zen vs Core.

      **Two real rivalries, not six competitors.** TI sells analog chips to industrial and automotive customers, Qualcomm sells ARM-based mobile processors, Broadcom sells networking and storage controllers. The head-to-head contests are Intel vs AMD in x86 and NVIDIA vs AMD in GPUs and AI accelerators, so I compared those pairs directly.

      - **Intel vs AMD:** Intel led on every metric through 2017. AMD's Zen launch in 2017 shows up in the financials with a lag; revenue only broke meaningfully higher in 2021-2022. By 2024-2025 Intel's ROIC was negative.
      - **NVIDIA vs AMD:** in 2020 AMD actually led on ROIC (50.2% vs 24.3%), thanks to a lean capital base before Xilinx. The divergence came from 2021 on, driven by AI training hardware and the CUDA ecosystem. By 2025: 102.6% vs 6.8%.

      AMD's harder fight is the second one. Against Intel it competed on engineering execution. Against NVIDIA it competes on software ecosystem depth (ROCm vs CUDA), which is a developer adoption and network-effects problem.

      **What the multiples price in (2025)**

      - Qualcomm: cheapest at 14.2x EV/EBITDA, pricing in limited AI exposure.
      - TI: 21.3x EV/EBITDA, valued as a stable but cyclical analog business.
      - Intel: no meaningful P/E (losses), 19.1x EV/EBITDA, which looks high for current earnings power. Either a recovery or acquisition optionality is priced in; the margin and ROIC history suggests a recovery takes years.
      - NVIDIA: 63.5x P/E and 55.5x EV/EBITDA. The question is how long a 100%+ ROIC lasts.
      - AMD: 80.8x P/E, a premium to NVIDIA despite lower ROIC, which assumes ROIC recovers as Xilinx is absorbed and AI GPU shipments scale.

      **Caveats**

      - Annual data from Financial Modeling Prep, fiscal years as reported (NVIDIA's fiscal year does not match the calendar year).
      - AMD's ROIC is depressed by the roughly $35bn Xilinx acquisition (2022) expanding invested capital; on operating assets alone its returns look better.
      - Broadcom's growth (from $4.3bn in 2014 to $20.8bn in 2018) is mostly acquisitions, so its revenue line is not comparable to organic growth.
      - Multiples are snapshots and will have moved since the article was written.

      **Method:** everything was calculated with the Finance Toolkit, an open-source Python library I built and maintain. The full write-up with code and interactive charts is here: https://www.jeroenbouma.com/articles/semiconductor-sector-analysis-finance-toolkit

      Not investment advice. Curious how others here would treat Intel's foundry spending when comparing ROIC across fab and fabless names.
