# Drafts for Competitor and Sector Analysis with the Finance Toolkit. Starting points, edited before posting.
article: /articles/semiconductor-sector-analysis-finance-toolkit
written: 2026-10-02
linkedin:
  text: |
    In 2010 Intel had a 66% gross margin and NVIDIA had 35.4%. In 2025 Intel was at 34.8% and NVIDIA at 75.0%.

    Same industry, same fifteen years, opposite directions.

    Most of that split follows one line: who owns the fabs. Intel makes its own chips. Once its processes fell behind TSMC's, first by one node and then two, each product cycle made its chips costlier to produce, while fabless rivals got better nodes for less.

    AMD shows it most clearly. Its gross margin was 33% in 2014, when it was fighting for survival, and 49.5% in 2025. It has been above Intel's since 2022, a crossover driven more by manufacturing than by products.

    Returns tell the second half. In 2025 NVIDIA earned a 102.6% return on invested capital, AMD 6.8% and Intel slightly below zero. The $35 billion Xilinx deal weighs on AMD's figure, but the bigger gap is CUDA, fifteen years of software that ROCm cannot replicate quickly. AMD beat Intel on engineering execution; against NVIDIA it needs developer adoption, which is slower and costlier.

    The lesson: before comparing a sector, decide who actually competes with whom. Here the real contests are two pairs, Intel vs AMD in x86 and NVIDIA vs AMD in AI accelerators.

    I pulled the data with the Finance Toolkit, the open-source Python library I built. Full comparison, including what the multiples price in:
    https://www.jeroenbouma.com/articles/semiconductor-sector-analysis-finance-toolkit

    Not investment advice.

