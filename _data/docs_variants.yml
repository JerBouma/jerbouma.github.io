# Sidebar entries that are the same Finance Toolkit function with a different
# argument each get their own page (_plugins/docs_metric_pages.rb). In
# _data/navigation.yml such an entry links to "<module>#<function>--<variant>".
#
# Per module and sidebar anchor:
#   argument  the argument added to the function call ('method="adjusted"')
#   match     lines of the function's own docstring that describe this variant
#             (each line is found, together with a formula block right under it,
#             or the whole formula block when the line sits inside one)
#   intro     optional: words put in front of a docstring bullet that starts mid-sentence
#   drop      optional: arguments of the function's own example that don't apply here
#   output    what the example returns, from _scripts/docs_variant_outputs.py
#   example   optional: the code example, when adding the argument to the
#             function's own example doesn't read right
#
# The function's own page (the anchor without "--") keeps to the default. Its
# entry has no argument but:
#   cut       [from, until] pairs: the lines from the one containing "from" up to
#             the one containing "until" go (until left out: to the end)
#   trim      sentences that go, from where the text is found to the line's end
# and the page links to the variant pages instead.
performance:
  get_sharpe_ratio:
    cut: [["The plain Sharpe ratio only looks at", "**See definition:**"]]
    trim: [" The variants are also known as"]
  get_sharpe_ratio--adjusted:
    argument: 'method="adjusted"'
    output: |
      | Date   |     SPY |     TLT |     GLD |   BTCUSD |
      |:-------|--------:|--------:|--------:|---------:|
      | 2021   |  2.0065 | -0.3649 | -0.5182 |   0.6323 |
      | 2022   | -0.8295 | -1.8794 | -0.1654 |  -1.1936 |
