    match: ['- `"probabilistic"`']
  get_sharpe_ratio--deflated:
    argument: 'method="deflated"'
    output: |
      | Date   |    SPY |    TLT |    GLD |
      |:-------|-------:|-------:|-------:|
      | 2021   | 0.2164 | 0.0111 | 0.0003 |
      | 2022   | 0.0001 | 0.0001 | 0.0011 |
      | 2023   | 0.1043 | 0.0289 | 0.013  |
      | 2024   | 0.099  | 0.003  | 0.069  |
      | 2025   | 0.0157 | 0.031  | 0.3167 |
    # without BTCUSD: with a crypto among the tickers method="deflated" returns no rows
    example: |
      ```python
      from financetoolkit import Toolkit

      toolkit = Toolkit(
          ["SPY", "TLT", "GLD"],
          api_key="FINANCIAL_MODELING_PREP_KEY",
          start_date="2021-01-01",
          end_date="2025-12-31",
          benchmark_ticker=None,
      )

      toolkit.performance.get_sharpe_ratio(method="deflated")
      ```
    match: ['- `"deflated"`']

