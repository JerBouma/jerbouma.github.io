  last: 252
  title: Volume Weighted Average Price
  subtitle: SPY, the last year of the example
technicals.get_parabolic_sar:
  price: CLUSD
  columns: [Close, {CLUSD: Parabolic SAR}]
  dots: [Parabolic SAR]
  last: 252
  title: Parabolic SAR
  subtitle: Crude oil, the last year of the example; the SAR below the price marks an uptrend, above it a downtrend
technicals.get_supertrend:
  ticker: SHOP
  price: SHOP
  split: {column: Supertrend, by: Trend Direction, names: {1: Uptrend, -1: Downtrend}}
  columns: [Close, Uptrend, Downtrend]
  colors: {Uptrend: "#34d399", Downtrend: "#f472b6"}
  last: 252
  title: Supertrend
  subtitle: Shopify, the last year of the example
technicals.get_chandelier_exit:
  ticker: TSLA
