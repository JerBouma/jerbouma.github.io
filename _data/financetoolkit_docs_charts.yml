# The charts on the Finance Toolkit method pages whose example table holds only the
# last days of a longer result. _scripts/financetoolkit_docs_charts.py runs the page's
# example over its whole period and plots what is set here (its docstring has the keys).
# Titles name what is plotted; the subtitle says which instrument and how it is built.

# Technicals: overlays on the price
technicals.get_bollinger_bands:
  ticker: USDJPY
  columns: [Close, Upper Band, Middle Band, Lower Band]
  cloud: [Upper Band, Lower Band]
  last: 252
  title: Bollinger Bands
  subtitle: USD/JPY, the last year of the example, with the 20-day bands two standard deviations wide
technicals.get_keltner_channels:
  ticker: ^GDAXI
  price: ^GDAXI
  columns: [Close, Upper Line, Middle Line, Lower Line]
  cloud: [Upper Line, Lower Line]
  last: 252
  format: amount
  title: Keltner Channels
  subtitle: DAX, the last year of the example
technicals.get_donchian_channels:
  ticker: HGUSD
  price: HGUSD
  columns: [Close, Upper Channel, Middle Channel, Lower Channel]
  cloud: [Upper Channel, Lower Channel]
  last: 252
  title: Donchian Channels
  subtitle: Copper, the last year of the example
technicals.get_ichimoku_cloud:
  ticker: ^N225
  price: ^N225
  columns: [Close, Conversion Line, Base Line, Leading Span A, Leading Span B]
  cloud: [Leading Span A, Leading Span B]
  last: 252
  format: amount
  title: Ichimoku Cloud
  subtitle: Nikkei 225, the last year of the example
technicals.get_moving_average:
  price: ^GSPC
  columns: [Close, {^GSPC: 50-Day Moving Average}]
