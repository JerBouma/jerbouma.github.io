# The resume, in one place. _pages/resume.md renders it as the timeline on
# /resume and _pages/cv.html as the printable CV that the deploy turns into
# /assets/files/jeroen-bouma-cv.pdf (see _scripts/build-cv-pdf.js).
#
# Entries are listed newest first. type is experience, education,
# certification or opensource; active marks the ones that are ongoing.
# description may contain HTML. testimonials also appear as references on
# the CV when cv_reference is true, with their excerpt (verbatim, "…" marks
# skipped text). stats on the open-source entries come from GitHub (stars,
# forks) and pepy.tech (all-time PyPI downloads), rounded down.

headline: "Quantitative Investment Strategist"

# the paragraphs at the top of /resume; the CV uses the first two as its profile
intro:
  - "My background is in Quantitative Finance and most of my work comes down to putting investment theory into practice with Python. I am currently a Quantitative Investment Strategist at a.s.r. asset management, where I help build, maintain and use the models for Solvency II internal model calculations, lifecycle investing, portfolio optimization and ALM across multi-billion euro portfolios. I also contribute to our work at the intersection of quantitative finance and AI, from forecasting models to generative AI built on agentic frameworks and retrieval-augmented generation (RAG)."
  - "Outside of my day job, I’ve built open-source Python libraries such as the <a href=\"https://github.com/JerBouma/FinanceToolkit\">Finance Toolkit</a> and <a href=\"https://github.com/JerBouma/FinanceDatabase\">Finance Database</a>. They are used by thousands of analysts, developers and students."
  - "Below you can find my work experience, open-source projects, certifications and education, together with testimonials from colleagues."


# areas of expertise in two groups. The CV lists them under the profile; on
# /resume each timeline entry shows the ones it covers (its expertise list),
# marked with the color of the group (key).
expertise:
  - group: "Quantitative Finance"
    key: quant
    items: ["Strategic Asset Allocation", "Asset Liability Management", "Lifecycle Investing", "Portfolio Optimization", "Liability Hedging", "Solvency II Internal Models", "Economic Scenario Generation", "Econometrics & Time Series", "Factor Models"]
  - group: "Artificial Intelligence"
    key: ai
    items: ["Agentic Frameworks", "RAG Pipelines", "Machine Learning", "AI Evaluation & Guardrails"]

languages:
  - name: "Dutch"
    level: "Professional"
  - name: "English"
    level: "Professional"

# shown at the bottom of /resume and of the CV
hobbies:
  - label: "Tinkering"
    text: "I like to tinker with technology at home, from home automation to mini PCs and home servers. Lately that includes experimenting with LLMs and agentic setups, next to the many programming experiments I run in the financial domain."
  - label: "Food & Wine"
    text: "I love cooking and wine tasting, with a real adoration for champagne."
  - label: "Sports"
    text: "I stay active through running, swimming and cycling. Combining the three into a triathlon is on my list for some day."


# the /resume journey, newest first. Every entry below names its chapter and
# a start (YYYY-MM) that orders it within the chapter.
chapters:
  - id: asr
    short: "a.s.r."
    years: "2023 – now"
    icon: "fa-briefcase"
    title: "Quant and AI in asset management"
    blurb: "Institutional asset management, first in financial risk and now as Quantitative Investment Strategist, where quantitative models and AI come together."
  - id: openbb
    short: "OpenBB"
    years: "2022 – 2023"
    icon: "fa-rocket"
    title: "Open-source finance at OpenBB"
    blurb: "The Finance Database brought me to OpenBB, a start-up building open-source investment research. Here I learned to lead a team and to turn financial theory into a product people use."
  - id: pggm
    short: "PGGM"
    years: "2019 – 2022"
    icon: "fa-chart-line"
    title: "Modelling for pension funds"
    blurb: "My first job, building and running the models behind the advice to Dutch pension funds. Next to it I studied for the CFA and RBA, and in my own time the open-source projects kept growing."
  - id: studies
    short: "Studies"
    years: "2013 – 2019"
    icon: "fa-graduation-cap"
    title: "Learning the foundations"
    blurb: "Economics in Groningen, then Banking & Finance in Utrecht. The quantitative track and its Python courses set the direction, and just before graduating I started the Finance Toolkit."

