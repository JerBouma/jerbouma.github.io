    testimonials:
      - name: "Didier Lopes"
        cv_reference: true
        role: "CEO at OpenBB"
        linkedin: "https://www.linkedin.com/in/didier-lopes/"
        image: "/assets/images/testimonials/DidierLopes.jpeg"
        quote: "“On the 13th of October 2021, I received an email from Jeroen about adding one of his finance GitHub packages to the OpenBB Terminal (then Gamestonk Terminal). After digging into his open source projects and his achievements I was very impressed. When we had a chat regarding how to work together, I offered him a job on the spot. Jeroen was at the intersection of finance, programming and open source - which is a combination that is very hard to find - even today (almost 2 years later).\n<br><br>\nJeroen ended up joining us a few months after that initial meeting. He started in the role of Product Manager where he helped drive the direction of the OpenBB Terminal, not only from a product perspective but also joining the development team. Menus such as economy, portfolio, econometrics, fixed income are Jeroen’s legacy and they wouldn’t have the quality they have today without Jeroen’s financial theory knowledge - ultimately, the team saw Jeroen as the go-to person when financial theory was involved.\n<br><br>\nMore recently, Jeroen shifted to the role of Product Marketing Manager so that he could focus on the go-to market and showing users (through documentation, webinars, videos) how they could use OpenBB products for real use cases. In addition, he led OpenBB’s academia motion, and created presentations such as ‘The Greek Government Debt Crisis’, ‘Performing Financial Due Diligence’ and ‘The Influence of the Central Bank’ which used OpenBB for research and were presented at different universities in the UK and Netherlands.\n<br><br>\nApart from his financial expertise, I always admired Jeroen’s work ethic and organization skills. As a startup founder, you want people on your team that get shit done, and Jeroen was one of those people. I never had to worry with a task not being done, or being done late. If anything, he always went above and beyond. I highly recommend Jeroen.”"
        excerpt: "Jeroen was at the intersection of finance, programming and open source - which is a combination that is very hard to find … ultimately, the team saw Jeroen as the go-to person when financial theory was involved. … I highly recommend Jeroen."
      - name: "Minh Hoang"
        role: "Product Manager at OpenBB"
        linkedin: "https://www.linkedin.com/in/minhhoang95/"
        image: "/assets/images/testimonials/MinhHoang.jpeg"
        quote: "“I highly recommend Jeroen as an asset in any organization. Jeroen led and executed OpenBB’s go-to-market initiatives, including Academia, with exceptional skill. It is not easy to find Jeroen’s combination of solid finance knowledge and Programming knowledge. On top of that, he consistently demonstrates a strong work ethic and a drive to achieve outstanding results.”"
        excerpt: "I highly recommend Jeroen as an asset in any organization. … It is not easy to find Jeroen’s combination of solid finance knowledge and Programming knowledge."
      - name: "Sri Chilukuri"
        role: "VP of Product Marketing at OpenBB"
        linkedin: "https://www.linkedin.com/in/srichilukuri/"
        image: "/assets/images/testimonials/SriChilukuri.jpeg"
        quote: "“Jeroen has been a delight to work with. With his expertise in investment research and “can do” attitude, he quickly transformed himself into an excellent product marketing manager at OpenBB. In fact, I would not hesitate to say that he was often the lone sane voice in helping steer the heavily engineering-centric company in the right business direction. His leadership of the highly successful OpenBB Terminal 2.0 launch event in November 2022 and the company’s ongoing go-to-market (GTM) push into Academia are testaments to his newly acquired product marketing skills as well as his overall professionalism. Jeroen has my highest recommendation and I look forward to working with him again in the future.”"
        excerpt: "With his expertise in investment research and “can do” attitude, he quickly transformed himself into an excellent product marketing manager at OpenBB. … Jeroen has my highest recommendation and I look forward to working with him again in the future."

