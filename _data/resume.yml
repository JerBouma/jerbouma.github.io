# The resume, in one place. _pages/resume.md renders it as the timeline on
# /resume and _pages/cv.html as the printable CV that the deploy turns into
# /assets/files/jeroen-bouma-cv.pdf (see _scripts/build-cv-pdf.js).
#
# Entries are listed newest first. type is experience, education,
# certification or opensource; active marks the ones that are ongoing.
# description may contain HTML. testimonials also appear as references on
# the CV when cv_reference is true, with their excerpt (verbatim, "…" marks
# skipped text).

headline: "Quantitative Investment Strategist"

# the paragraphs at the top of /resume; the CV uses the first two as its profile
intro:
  - "My background is in Quantitative Finance and most of my work comes down to putting investment theory into practice with Python. I am currently a Quantitative Investment Strategist at a.s.r. asset management, where I work on portfolio optimization and ALM for multi-billion euro portfolios and lead innovation at the intersection of quantitative finance and AI, putting existing large language models to work through agentic frameworks and retrieval-augmented generation (RAG)."
  - "Outside of my day job, I’ve built open-source Python libraries such as the <a href=\"/projects/financetoolkit\">Finance Toolkit</a> and <a href=\"/projects/financedatabase\">Finance Database</a>. They are used by thousands of analysts, developers and students worldwide."
  - "Below you can find my education, certifications, open-source projects and work experience, together with testimonials from colleagues."


# areas of expertise in three groups. The CV lists them under the profile; on
# /resume each timeline entry shows the ones it covers (its expertise list),
# marked with the colour of the group (key).
expertise:
  - group: "Quantitative Finance"
    key: quant
    items: ["Strategic Asset Allocation", "Asset Liability Management", "Portfolio Optimization", "Liability Hedging", "Risk & Solvency II", "Scenario Modelling", "Econometrics & Time Series"]
  - group: "Artificial Intelligence"
    key: ai
    items: ["LLM Applications in Finance", "RAG Pipelines", "Agentic Frameworks", "MCP Servers", "Machine Learning", "LLM Evaluation & Guardrails"]
  - group: "Product & Delivery"
    key: product
    items: ["Product Ownership (Scrum)", "AI Use-Case Design", "Stakeholder Management", "Open-Source Development"]

languages:
  - name: "Dutch"
    level: "Professional"
  - name: "English"
    level: "Professional"

