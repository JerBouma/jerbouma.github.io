# Bond valuations
get_present_value:
  question: At a 4.5% yield, what is a bond worth per 100 of face value with an annual coupon from 2% to 7%, for maturities of 2, 5, 10 and 30 years?
  tool: fixed_income
  arguments:
    coupon_rate: [0.02, 0.03, 0.04, 0.045, 0.05, 0.06, 0.07]
    years_to_maturity: [2, 5, 10, 30]
    yield_to_maturity: 0.045
get_duration:
  question: What is the modified duration of 2, 5, 10 and 30-year bonds with annual coupons from 0% to 8% at a 4.5% yield?
  tool: fixed_income
  arguments:
    duration_type: modified
    coupon_rate: [0.0, 0.02, 0.04, 0.06, 0.08]
    years_to_maturity: [2, 5, 10, 30]
    yield_to_maturity: 0.045
get_yield_to_maturity:
  question: What yield to maturity does a bond with a 4% annual coupon offer at prices from 90 to 110, for maturities of 2, 5, 10 and 30 years?
  tool: fixed_income
  arguments:
    coupon_rate: 0.04
    bond_price: [90, 95, 100, 105, 110]
    years_to_maturity: [2, 5, 10, 30]
get_par_yield:
  question: What par yields does the Bank of England's nominal spot curve of 31 December 2025 imply for gilts of 1 to 30 years, with semi-annual coupons?
  tool: fixed_income
  arguments:
    spot_rates: {"1": 0.0355, "2": 0.0363, "3": 0.0371, "5": 0.0394, "7": 0.042, "10": 0.0457, "15": 0.0502, "20": 0.0524, "25": 0.0532, "30": 0.0531}
    years_to_maturity: [1, 2, 3, 5, 7, 10, 15, 20, 25, 30]
    frequency: 2
get_forward_rate:
  question: Using EIOPA's euro risk-free spot curve for December 2025, which forward rates are implied from 1, 2, 5 and 10 years ahead out to 20 and 30 years?
  tool: fixed_income
  arguments:
    spot_rates: {"1": 0.0208, "2": 0.0216, "5": 0.0248, "10": 0.0286, "20": 0.0321, "30": 0.0328}
    near_maturity: [1, 2, 5, 10]
    far_maturity: [20, 30]
get_key_rate_duration:
  question: Which points of the US Treasury curve of 31 December 2025 drive the interest rate risk of 4% annual coupon bonds of 5, 10 and 30 years?
  tool: fixed_income
  arguments:
    coupon_rate: 0.04
    years_to_maturity: [5, 10, 30]
    spot_rates: {"1": 0.0348, "2": 0.0347, "5": 0.0373, "10": 0.0418, "20": 0.0479, "30": 0.0484}
get_yield_curve_spread:
  question: How steep was the US Treasury curve on 31 December 2025, measured by the spreads of the 5, 10, 20 and 30-year yields over the 3-month and 2-year yields?
  tool: fixed_income
  arguments:
    spot_rates: {"0.25": 0.0367, "0.5": 0.0359, "1": 0.0348, "2": 0.0347, "3": 0.0355, "5": 0.0373, "7": 0.0394, "10": 0.0418, "20": 0.0479, "30": 0.0484}
    long_maturity: [5, 10, 20, 30]
    short_maturity: [0.25, 2]
get_z_spread:
  question: A 5% annual coupon corporate bond trades between 96 and 104. What Z-spread over the US Treasury curve of 31 December 2025 does that imply for maturities of 5, 10 and 20 years?
  tool: fixed_income
  arguments:
    coupon_rate: 0.05
    bond_price: [96, 98, 100, 102, 104]
    years_to_maturity: [5, 10, 20]
    spot_rates: {"0.25": 0.0367, "0.5": 0.0359, "1": 0.0348, "2": 0.0347, "3": 0.0355, "5": 0.0373, "7": 0.0394, "10": 0.0418, "20": 0.0479, "30": 0.0484}
get_breakeven_inflation_rate:
  question: What inflation rate did US Treasury and TIPS yields on 31 December 2025 price in over the next 5, 7, 10, 20 and 30 years?
  tool: fixed_income
  arguments:
    nominal_rates: {"5": 0.0373, "7": 0.0394, "10": 0.0418, "20": 0.0479, "30": 0.0484}
    real_rates: {"5": 0.0147, "7": 0.0169, "10": 0.0193, "20": 0.0239, "30": 0.0262}
    maturity: [5, 7, 10, 20, 30]
get_bond_equivalent_yield:
  question: What bond-equivalent yield do Treasury bills of 4, 13, 26 and 52 weeks offer at discount yields from 2% to 6%?
  tool: fixed_income
  arguments:
    discount_yield: [0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05, 0.055, 0.06]
    days_to_maturity: [28, 91, 182, 364]
get_taylor_price_change:
  question: If yields rise by 100 basis points from 4.5%, how much would bonds with 2%, 4% and 6% annual coupons lose for maturities of 2, 5, 10 and 30 years, estimated with duration and convexity?
  tool: fixed_income
  arguments:
    coupon_rate: [0.02, 0.04, 0.06]
    years_to_maturity: [2, 5, 10, 30]
    yield_to_maturity: 0.045
    yield_change: 0.01

# Derivative valuations
get_derivative_price:
  question: Under the Black model, what is a receiver swaption on a 5-year swap worth on $10 million, at strikes from 3% to 4.5% and expiries of 1, 2 and 5 years, with a 3.75% forward swap rate and 25% volatility?
  tool: fixed_income
  arguments:
    model: black
    forward_rate: 0.0375
    strike_rate: [0.03, 0.0325, 0.035, 0.0375, 0.04, 0.0425, 0.045]
    years_to_maturity: [1, 2, 5]
    tenor: 5
    volatility: 0.25
    notional: 10000000
    end_date: "2025-12-31"

# Government bonds
get_government_bond_yield:
  question: How did 3-month interest rates in the United States, the United Kingdom, Japan and Germany move from 2010 to 2025?
  tool: rates
  arguments:
    countries: United States,United Kingdom,Japan,Germany
    short_term: true
    period: monthly
    start_date: "2010-01-01"
    end_date: "2025-12-31"
get_treasury_rates:
  question: How did the 3-month, 2-year, 10-year and 30-year US Treasury par yields move through 2025?
  tool: rates
  arguments:
    start_date: "2025-01-01"
    end_date: "2025-12-31"
    show_columns: 3 Month,2 Year,10 Year,30 Year
get_government_bond_yield_curve:
  question: What did the government bond yield curves of the United States, Germany and Japan look like in December 2025, from 1 to 30 years?
  tool: rates
  arguments:
    countries: United States,Germany,Japan
    period: monthly
    start_date: "2025-12-01"
    end_date: "2025-12-31"
    show_columns: 1Y,2Y,3Y,5Y,7Y,10Y,20Y,30Y
get_bank_of_england_yield_curve:
  question: How did the Bank of England's nominal zero-coupon gilt yields at 2, 5, 10 and 30 years move through 2025?
  tool: rates
  arguments:
    curve: nominal
    start_date: "2025-01-01"
    end_date: "2025-12-31"
    show_columns: 2Y,5Y,10Y,30Y

# Corporate bonds
get_ice_bofa_option_adjusted_spread:
  question: How did the option-adjusted spreads of investment grade US corporate bonds, rated AAA to BBB, move through 2025?
  tool: rates
  arguments:
    maturity: false
    start_date: "2025-01-01"
    end_date: "2025-12-31"
get_ice_bofa_effective_yield:
  question: How did the effective yields of US corporate bonds by maturity bucket move through 2025?
  tool: rates
  arguments:
    maturity: true
    start_date: "2025-01-01"
    end_date: "2025-12-31"
get_ice_bofa_total_return:
  question: How did the total return index of BBB-rated US corporate bonds develop through 2025?
  tool: rates
  arguments:
    maturity: false
    start_date: "2025-01-01"
    end_date: "2025-12-31"
    show_columns: BBB
get_ice_bofa_yield_to_worst:
  question: How did the yield to worst of US corporate bonds rated AAA to B move through 2025?
  tool: rates
  arguments:
    maturity: false
    start_date: "2025-01-01"
    end_date: "2025-12-31"
get_corporate_bond_yields:
  question: How did corporate bond yields in Germany, Australia and the United States compare from 2010 to 2025?
  tool: rates
  arguments:
    countries: Germany,Australia,United States
    start_date: "2010-01-01"
    end_date: "2025-12-31"
    show_columns: All ratings,BBB 10Y,Baa
get_moodys_corporate_bond_yields:
  question: How did Moody's Aaa and Baa US corporate bond yields move from 2000 to 2025?
  tool: rates
  arguments:
    period: monthly
    start_date: "2000-01-01"
    end_date: "2025-12-31"
get_hqm_corporate_bond_yield_curve:
  question: How did the yields on the US Treasury's high quality market corporate bond spot curve at 1, 5, 10 and 30 years move from 2015 to 2025?
  tool: rates
  arguments:
    rate: spot
    start_date: "2015-01-01"
    end_date: "2025-12-31"
get_hqm_corporate_bond_spread:
  question: How did the spread of high quality US corporate bonds over Treasuries at 2, 5, 10 and 30 years move from 2015 to 2025?
  tool: rates
  arguments:
    start_date: "2015-01-01"
    end_date: "2025-12-31"
get_corporate_borrowing_cost:
  question: How did the cost of bank borrowing for companies in Germany, France, Italy, Spain and the Netherlands compare from 2010 to 2025?
  tool: rates
  arguments:
    countries: Germany,France,Italy,Spain,Netherlands
    start_date: "2010-01-01"
    end_date: "2025-12-31"

# Credit risk and stress
get_rating_transition_matrix:
  question: How likely were S&P-rated corporates to keep, raise or lose their rating, or to default, during 2024?
  tool: rates
  arguments:
    agency: S&P
    rating_type: corporate
    year: 2024
    horizon: 1
get_default_rates:
  question: What share of S&P-rated BB, B and CCC corporates defaulted each year from 2015 to 2025?
  tool: rates
  arguments:
    agency: S&P
    rating_type: corporate
    start_date: "2015-01-01"
    end_date: "2025-12-31"
get_excess_bond_premium:
  question: How did the Gilchrist-Zakrajšek credit spread and excess bond premium move from 2000 to 2025?
  tool: rates
  arguments:
    start_date: "2000-01-01"
    end_date: "2025-12-31"
get_financial_stress_index:
  question: How did systemic financial stress in the euro area, the United States and the United Kingdom compare from 2007 to 2025, measured by the ECB's CISS?
  tool: rates
  arguments:
    countries: Euro Area,United States,United Kingdom
    period: monthly
    start_date: "2007-01-01"
    end_date: "2025-12-31"

# Regulatory curves
get_eiopa_risk_free_rate:
  question: How did EIOPA's euro risk-free spot rates at 1, 5, 10 and 30 years move from 2023 to 2025?
  tool: rates
  arguments:
    countries: Euro Area
    curve: spot_no_va
    start_date: "2023-01-01"
    end_date: "2025-12-31"
get_eiopa_symmetric_adjustment:
  question: How did the Solvency II symmetric adjustment to the equity capital charge move from 2015 to 2025?
  tool: rates
  arguments:
    period: monthly
    start_date: "2015-01-01"
    end_date: "2025-12-31"

# Central banks
get_euribor_rates:
  question: How did the 1, 3, 6 and 12-month Euribor rates move from 2021 to 2025?
  tool: rates
  arguments:
    start_date: "2021-01-01"
    end_date: "2025-12-31"
get_federal_reserve_rates:
  question: How did the Secured Overnight Financing Rate (SOFR) and its 1st and 99th percentiles move through 2025?
  tool: rates
  arguments:
    rate: SOFR
    start_date: "2025-01-01"
    end_date: "2025-12-31"
get_european_central_bank_rates:
  question: How did the ECB's main refinancing rate change from July 2022 to December 2025?
  tool: rates
  arguments:
    rate: refinancing
    start_date: "2022-07-01"
    end_date: "2025-12-31"
