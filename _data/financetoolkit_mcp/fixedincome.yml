get_present_value:
  question: What were the benchmark 2- to 30-year US Treasuries worth on the Treasury zero-coupon curve on 5 November 2026, next to their market prices?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
    show_columns: "Coupon,Maturity,Price,Present Value"
get_duration:
  question: What was the modified duration of the benchmark 2- to 30-year US Treasuries on 5 November 2026?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
    show_columns: "Security Type,Coupon,Maturity,Price,Modified Duration"
get_yield_to_maturity:
  question: What yield to maturity did the benchmark 2- to 30-year US Treasuries offer on 5 November 2026?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
    show_columns: "Security Type,Coupon,Maturity,Price,Yield to Maturity"
get_forward_rate:
  question: Which forward rates from 1, 2 and 5 years to 5, 10 and 30 years did the US Treasury curve imply on 5 November 2026?
  tool: fixed_income
  arguments:
    near_maturity:
    - 1
    - 2
    - 5
    far_maturity:
    - 5
    - 10
    - 30
    date: "2026-11-05"
get_par_yield:
  question: What par yields did the US Treasury curve imply for maturities of 1, 4, 8, 15 and 25 years on 5 November 2026?
  tool: fixed_income
  arguments:
    years_to_maturity:
    - 1
    - 4
    - 8
    - 15
    - 25
    date: "2026-11-05"
get_yield_curve_spread:
  question: How wide were the spreads of the 5-, 10- and 30-year US Treasury yields over the 3-month and 2-year yields on 5 November 2026?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
get_breakeven_inflation_rate:
  question: What inflation rate did nominal and inflation-protected US Treasuries of 5 to 30 years price in on 5 November 2026?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
get_z_spread:
  question: What Z-spread over the Treasury curve did Apple's bonds maturing from 2030 to 2035 trade at?
  tool: fixed_income
  arguments:
    issuer: Apple
    maturity_start: "2030-01-01"
    maturity_end: "2035-12-31"
    show_columns: "Issuer,Coupon,Maturity,Price,Price Date,Z-Spread"
get_bond_equivalent_yield:
  question: What discount yields and bond-equivalent yields did US Treasury bills offer on 5 November 2026?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
get_key_rate_duration:
  question: What were the 2-, 5-, 10- and 30-year key rate durations of the benchmark US Treasuries on 5 November 2026?
  tool: fixed_income
  arguments:
    key_rate_maturity:
    - 2
    - 5
    - 10
    - 30
    date: "2026-11-05"
    show_columns: "Coupon,Maturity,2Y,5Y,10Y,30Y"
get_taylor_price_change:
  question: How much would the benchmark 2- to 30-year US Treasuries lose if yields rose by 100 basis points from 5 November 2026?
  tool: fixed_income
  arguments:
    yield_change: 0.01
    date: "2026-11-05"
    show_columns: "Security Type,Coupon,Maturity,Price,Price Change"
get_government_bond_yield:
  question: How did long-term government bond yields in Japan, the United States and Germany move in each month from May to December 2023?
  tool: rates
  arguments:
    countries: Japan,United States,Germany
    short_term: false
    period: monthly
    start_date: "2023-05-01"
    end_date: "2023-12-31"
get_government_bond_yield_curve:
  question: What were Germany's government bond yields at 1, 2, 5, 10, 20 and 30 years on each day from 28 September to 1 October 2026?
  tool: rates
  arguments:
    countries: Germany
    period: daily
    start_date: "2026-09-28"
    end_date: "2026-10-01"
    show_columns: 1Y,2Y,5Y,10Y,20Y,30Y
get_treasury_rates:
  question: What were the US Treasury par yields from 1 month to 30 years on each trading day from 1 to 15 January 2024?
  tool: rates
  arguments:
    start_date: "2024-01-01"
    end_date: "2024-01-15"
get_zero_coupon_curve:
  question: What were the US zero-coupon rates at 1, 2, 5, 10, 20 and 30 years on each day from 19 to 23 October 2026?
  tool: rates
  arguments:
    countries: United States
    start_date: "2026-10-19"
    end_date: "2026-10-23"
    show_columns: 1Y,2Y,5Y,10Y,20Y,30Y
get_nelson_siegel_svensson:
  question: What were the Nelson-Siegel-Svensson parameters of Germany's yield curve on each day from 19 to 23 October 2026?
  tool: rates
  arguments:
    countries: Germany
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_yield_curve_principal_components:
  question: How much of the monthly moves in the US yield curve from 2016 to 2025 did the level, slope and curvature components explain, and how did each maturity load on them?
  tool: rates
  arguments:
    countries: United States
    country: United States
    period: monthly
    start_date: "2016-01-01"
    end_date: "2025-12-31"
get_short_rate_model:
  question: What do Vasicek and CIR models calibrated to the US 6-month Treasury yield from 2000 to October 2026 say about mean reversion, the long-run rate and the zero-coupon curve?
  tool: rates
  arguments:
    countries: United States
    country: United States
    short_rate: 6M
    start_date: "2000-01-01"
    end_date: "2026-10-23"
get_short_rate_simulation:
  question: Where could the US 6-month rate be in each of the next five years according to a Hull-White simulation fitted from 2000 to October 2026, with its mean and 5th to 95th percentiles?
  tool: rates
  arguments:
    countries: United States
    country: United States
    model: hull_white
    short_rate: 6M
    years: 5
    steps_per_year: 1
    start_date: "2000-01-01"
    end_date: "2026-10-23"
get_treasury_auctions:
  question: What were the yield, bid-to-cover ratio and indirect bidder share of the last five 10-year Treasury note auctions up to October 2026?
  tool: rates
  arguments:
    security_type: Note
    security_term: 10-Year
    start_date: "2025-01-01"
    end_date: "2026-10-23"
    show_columns: Security Term,Reopening,Yield,Bid-to-Cover Ratio,Indirect Bidder Share
    limit: -5
get_ice_bofa_option_adjusted_spread:
  question: How did the option-adjusted spreads of US corporate bonds by maturity, from 1-3 years to 15+ years, move from 1 to 15 January 2024?
  tool: rates
  arguments:
    maturity: true
    start_date: "2024-01-01"
    end_date: "2024-01-15"
get_ice_bofa_effective_yield:
  question: How did the effective yields of US corporate bonds by rating, from AAA to CCC, move from 1 to 15 January 2024?
  tool: rates
  arguments:
    maturity: false
    start_date: "2024-01-01"
    end_date: "2024-01-15"
get_ice_bofa_total_return:
  question: How did the total return indices of US corporate bonds by maturity, from 1-3 years to 15+ years, develop from 1 to 15 January 2024?
  tool: rates
  arguments:
    maturity: true
    start_date: "2024-01-01"
    end_date: "2024-01-15"
get_ice_bofa_yield_to_worst:
  question: How did the yield to worst of US corporate bonds by rating, from AAA to CCC, move from 1 to 15 January 2024?
  tool: rates
  arguments:
    maturity: false
    start_date: "2024-01-01"
    end_date: "2024-01-15"
get_hqm_corporate_bond_yield_curve:
  question: How did the US Treasury's high quality market corporate bond spot rates at 1, 5, 10, 30 and 100 years move in each month from March to August 2026?
  tool: rates
  arguments:
    rate: spot
    start_date: "2026-03-01"
    end_date: "2026-08-31"
    show_columns: 1Y,5Y,10Y,30Y,100Y
get_hqm_corporate_bond_spread:
  question: How did the spread of high quality US corporate bonds over Treasuries at 2, 5, 10 and 30 years move in each month from March to August 2026?
  tool: rates
  arguments:
    start_date: "2026-03-01"
    end_date: "2026-08-31"
get_corporate_bond_yields:
  question: How did corporate bond spreads over government bonds in Germany and Australia, for all ratings, A at 5 years and BBB at 5 and 10 years, move in each month from March to August 2026?
  tool: rates
  arguments:
    countries: Germany,Australia
    spread: true
    start_date: "2026-03-01"
    end_date: "2026-08-31"
    show_columns: All ratings,A 5Y,BBB 5Y,BBB 10Y
get_rating_transition_matrix:
  question: How likely were S&P-rated corporates from AAA to CCC to keep, raise or lose their rating, or to default, during 2025?
  tool: rates
  arguments:
    agency: S&P
    rating_type: corporate
    year: 2025
    horizon: 1
    show_columns: AAA,AA,A,BBB,BB,B,CCC,D
    limit: 7
get_default_rates:
  question: What share of S&P-rated BBB, BB, B and CCC corporates defaulted each year from 2018 to 2025?
  tool: rates
  arguments:
    agency: S&P
    rating_type: corporate
    start_date: "2018-01-01"
    end_date: "2025-12-31"
    show_columns: BBB,BB,B,CCC
get_implied_default_probability:
  question: What default probabilities over 1, 3, 5 and 10 years did US corporate bond spreads by rating imply on 5 November 2026?
  tool: fixed_income
  arguments:
    end_date: "2026-11-05"
get_moodys_corporate_bond_yields:
  question: How did the spreads of Moody's Aaa and Baa US corporate bonds over the 10-year Treasury move from March to August 2026?
  tool: rates
  arguments:
    period: monthly
    spread: true
    start_date: "2026-03-01"
    end_date: "2026-08-31"
get_excess_bond_premium:
  question: How did the Gilchrist-Zakrajšek credit spread and the excess bond premium move from February to July 2026?
  tool: rates
  arguments:
    start_date: "2026-02-01"
    end_date: "2026-07-31"
get_eiopa_risk_free_rate:
  question: How did EIOPA's euro and UK risk-free spot rates at 1, 10, 30, 60 and 150 years move in each month from July to September 2026?
  tool: rates
  arguments:
    countries: Euro Area,United Kingdom
    curve: spot_no_va
    maturity_years: 1,10,30,60,150
    start_date: "2026-07-01"
    end_date: "2026-09-30"
get_eiopa_symmetric_adjustment:
  question: How did the Solvency II symmetric adjustment and the type 1 and type 2 equity charges move in each month from April to September 2026?
  tool: rates
  arguments:
    period: monthly
    start_date: "2026-04-01"
    end_date: "2026-09-30"
get_bank_of_england_yield_curve:
  question: How did the Bank of England's nominal zero-coupon gilt yields at 1, 3, 5, 10, 20 and 30 years move in each month from April to September 2026?
  tool: rates
  arguments:
    curve: nominal
    period: monthly
    start_date: "2026-04-01"
    end_date: "2026-09-30"
    show_columns: 1Y,3Y,5Y,10Y,20Y,30Y
get_corporate_borrowing_cost:
  question: How did the cost of bank borrowing for companies in the euro area, Germany, France, Italy and Spain compare in each month from March to August 2026?
  tool: rates
  arguments:
    countries: Euro Area,Germany,France,Italy,Spain
    start_date: "2026-03-01"
    end_date: "2026-08-31"
get_financial_stress_index:
  question: How did financial stress in the euro area, the United States, the United Kingdom and China compare in each month from April to September 2026?
  tool: rates
  arguments:
    countries: Euro Area,United States,United Kingdom,China
    period: monthly
    start_date: "2026-04-01"
    end_date: "2026-09-30"
get_euribor_rates:
  question: How did the 1, 3, 6 and 12-month Euribor rates move in each month from December 2023 to December 2025?
  tool: rates
  arguments:
    start_date: "2023-12-01"
    end_date: "2025-12-31"
get_european_central_bank_rates:
  question: What were the ECB's main refinancing, marginal lending and deposit facility rates on each day from 22 to 31 December 2025?
  tool: rates
  arguments:
    start_date: "2025-12-22"
    end_date: "2025-12-31"
get_federal_reserve_rates:
  question: What were the effective federal funds rate and its 1st, 25th, 75th and 99th percentiles on each trading day from 17 to 31 December 2025?
  tool: rates
  arguments:
    rate: EFFR
    start_date: "2025-12-17"
    end_date: "2025-12-31"
    show_columns: Rate,1st Percentile,25th Percentile,75th Percentile,99th Percentile
get_term_premium:
  question: What was the term premium on 2-, 5- and 10-year US Treasuries each month from May to October 2026?
  tool: rates
  arguments:
    start_date: "2026-05-01"
    end_date: "2026-10-31"
    period: monthly
    maturity_years: "2,5,10"
    show_columns: Term Premium
get_bond_universe:
  question: What did Apple's bonds maturing by the end of 2028 yield, and at which spread over Treasuries did they trade?
  tool: fixed_income
  arguments:
    issuer: APPLE INC
    maturity_end: "2028-12-31"
    show_columns: "Coupon,Maturity,Price,Yield to Maturity,Modified Duration,G-Spread"
get_treasury_securities:
  question: What did the US Treasury notes and bonds maturing in 2035 and 2036 yield on 5 November 2026, and what was their modified duration?
  tool: fixed_income
  arguments:
    date: "2026-11-05"
    bonds: "91282CMM0,91282CNC1,91282CNT4,91282CPJ4,912810FT0,91282CPZ8,91282CQQ7,91282CRF0"
