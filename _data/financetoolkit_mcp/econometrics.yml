get_augmented_dickey_fuller:
  question: Were the share prices of Coca-Cola, PepsiCo and Procter & Gamble stationary from 2021 to 2025, according to the augmented Dickey-Fuller test?
  tool: econometrics
  arguments:
    tickers: KO,PEP,PG
    start_date: "2021-01-01"
    end_date: "2025-12-31"
  chart:
    transpose: true
    keep:
      metric: P-Value
    format: ratio
    title: ADF Test P-Value
get_kpss_test:
  question: Were the share prices of JPMorgan, Bank of America and Wells Fargo stationary from 2021 to 2025, according to the KPSS test?
