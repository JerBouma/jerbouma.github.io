  arguments:
    tickers: XOM,USO
    include_benchmark: true
    start_date: "2021-01-01"
    end_date: "2025-12-31"
  chart:
    type: coef
    error: Std. Error
    x: metric
get_logistic_regression:
  question: How did the S&P 500's daily return change the odds of Apple closing higher in 2025, according to a logistic regression?
  tool: econometrics
  arguments:
    tickers: AAPL
    include_benchmark: true
    start_date: "2025-01-01"
    end_date: "2025-12-31"
  chart:
    type: coef
    error: Std. Error
    x: metric
get_probit_regression:
  question: How strongly did the Nasdaq-100's daily return (QQQ) predict whether Tesla closed higher in 2025, according to a probit regression?
  tool: econometrics
  arguments:
    tickers: TSLA,QQQ
    start_date: "2025-01-01"
    end_date: "2025-12-31"
  chart:
    type: coef
    error: Std. Error
    x: metric
