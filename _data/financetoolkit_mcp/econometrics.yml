  arguments:
    tickers: AAPL,MSFT,JPM,XOM,JNJ,PG,KO,WMT,CAT,NEE
    period: monthly
    start_date: "2021-01-01"
    end_date: "2025-12-31"
  chart:
    type: coef
    error: Std. Error
    x: metric
    coef: Risk Premium
get_fixed_effects:
