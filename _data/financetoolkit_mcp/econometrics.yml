  arguments:
    tickers: XOM,CVX,SHEL,BP,TTE
    independent_tickers: Benchmark
    start_date: "2021-01-01"
    end_date: "2025-12-31"
  chart:
    type: coef
    error: Std. Error
    x: metric
    keep:
      metric: Benchmark
get_random_effects:
