  arguments:
    tickers: BAC,KRE
    include_benchmark: true
    tau: 0.05
    start_date: "2021-01-01"
    end_date: "2025-12-31"
  chart:
    x: metric
    keep:
      metric: [KRE, Benchmark]
    values: [Coefficient]
    keep_benchmark: true
    format: ratio
    title: Coefficient at the 5% Quantile
get_fama_macbeth_regression:
