  arguments:
    tickers: SMCI,NVDA,TSM
    dependent_ticker: SMCI
    suspect_ticker: NVDA
    instrument_tickers: TSM
    start_date: "2025-01-01"
    end_date: "2025-12-31"
  chart:
    type: table
    rename: {metric: Result, "Hausman Wu Test": Value}
