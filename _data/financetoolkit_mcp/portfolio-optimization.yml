get_minimum_variance_weights:
  question: Which weights in Apple, Microsoft, Johnson & Johnson and ExxonMobil gave the lowest-volatility portfolio based on 2021 to 2025?
  tool: portfolio
  arguments:
    tickers: AAPL,MSFT,JNJ,XOM
    start_date: "2021-01-01"
    end_date: "2025-12-31"
get_maximum_sharpe_weights:
  question: Which weights in Apple, Microsoft, Johnson & Johnson and ExxonMobil, with at most 40% in any one stock, gave the highest Sharpe ratio based on 2021 to 2025?
  tool: portfolio
  arguments:
    tickers: AAPL,MSFT,JNJ,XOM
    start_date: "2021-01-01"
    end_date: "2025-12-31"
    maximum_weight: 0.4
get_mean_variance_weights:
