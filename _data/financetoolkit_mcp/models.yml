  arguments:
    tickers: ADBE,CRM,INTU
    growth_rate: 0.08
    perpetual_growth_rate: 0.025
    weighted_average_cost_of_capital: 0.09
    start_date: "2021-01-01"
    end_date: "2025-12-31"
