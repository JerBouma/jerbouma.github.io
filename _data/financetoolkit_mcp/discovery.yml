get_stock_screener:
  question: Which stocks, excluding ETFs, have a market cap between $1 million and $200 billion, a price between $100 and $200, a beta between 1 and 2, a daily volume between 100,000 and 2 million shares and a dividend between $1 and $2 per share?
  tool: discovery
  arguments:
    market_cap_higher: 1000000
    market_cap_lower: 200000000000
    price_higher: 100
    price_lower: 200
    beta_higher: 1
    beta_lower: 2
    volume_higher: 100000
    volume_lower: 2000000
    dividend_higher: 1
    dividend_lower: 2
    is_etf: false
get_stock_list:
  question: Show the ten companies from DS-PD to DSAQ-UN in the Finance Toolkit's list of stocks.
  tool: discovery
  arguments:
    show_columns: DS-PD,DS.TO,DS2P.L,DSAC,DSACU,DSACW,DSAI.CN,DSAIF,DSAQ,DSAQ-UN
get_stock_shares_float:
  question: What is the free float of the ten companies from INDI to INDIAMART.NS in the Finance Toolkit's list of floating shares?
  tool: discovery
  arguments:
    show_columns: INDI,INDI.L,INDIACEM.BO,INDIACEM.NS,INDIAGLYCO.BO,INDIAGLYCO.NS,INDIAHOME.BO,INDIAHOMES.BO,INDIAMART.BO,INDIAMART.NS
get_sectors_performance:
  question: How did each sector of NASDAQ-listed stocks move on each trading day from 26 February to 1 March 2024?
  tool: discovery
  arguments:
    start_date: "2024-02-26"
    end_date: "2024-03-01"
get_biggest_gainers:
  question: Which ten stocks are the biggest gainers of the day?
  tool: discovery
  arguments:
    limit: 10
get_biggest_losers:
  question: Which ten stocks are the biggest losers of the day?
  tool: discovery
  arguments:
    limit: 10
get_most_active_stocks:
