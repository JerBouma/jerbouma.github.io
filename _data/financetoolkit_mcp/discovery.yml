get_stock_list:
  question: Show the ten entries from DRNYX to DROOF in the Finance Toolkit's list of stocks.
  tool: discovery
  arguments:
    show_columns: DRNYX,DRNZ,DRO.AX,DROCX,DROME.AT,DRON.DE,DRON.L,DRONACHRYA.BO,DRONE.NS,DROOF
get_stock_shares_float:
  question: What is the free float of the ten companies from IMFP to IMHC in the Finance Toolkit's list of floating shares?
  tool: discovery
  arguments:
    show_columns: IMFP,IMG,IMG.TO,IMGI,IMGN,IMGP.L,IMGX,IMH,IMH.BK,IMHC
get_sectors_performance:
  question: How did each sector of NASDAQ-listed stocks move on each trading day from 19 to 23 October 2026?
  tool: discovery
  arguments:
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_biggest_gainers:
  question: Which ten stocks are the biggest gainers of the day?
  tool: discovery
  arguments:
    limit: 10
get_biggest_losers:
  question: Which ten stocks are the biggest losers of the day?
  tool: discovery
  arguments:
    limit: 10
get_most_active_stocks:
  question: Which ten stocks are the most actively traded today, and how far have their prices moved?
  tool: discovery
  arguments:
    limit: 10
get_delisted_stocks:
  question: Which ten companies were delisted most recently?
  tool: discovery
  arguments:
    limit: 10
get_crypto_list:
  question: Show the first ten cryptocurrencies in the Finance Toolkit's list of cryptocurrencies.
  tool: discovery
  arguments:
    limit: 10
get_forex_list:
  question: Show the first ten currency pairs in the Finance Toolkit's list of currency pairs.
  tool: discovery
  arguments:
    limit: 10
get_commodity_list:
  question: Which commodities can I get prices for with the Finance Toolkit? Show the first ten.
  tool: discovery
  arguments:
    limit: 10
get_etf_list:
  question: Show the first ten ETFs in the Finance Toolkit's list of ETFs.
  tool: discovery
  arguments:
    limit: 10
get_index_list:
  question: Show the first ten indices in the Finance Toolkit's list of indices.
  tool: discovery
  arguments:
    limit: 10
get_index_constituents:
  question: Were Apple, Fannie Mae, Lehman Brothers, Merrill Lynch and Wachovia in the S&P 500 on 1 September 2008, and when was each added to and removed from the index?
  tool: discovery
  arguments:
    index: "S&P 500"
    date: "2008-09-01"
    show_columns: "AAPL,FNMA,LEHMQ,MER,WB"
get_stock_news:
  question: What are the five latest stock market headlines, with the symbol and publisher of each?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Symbol,Publisher,Title
get_general_news:
  question: What are the five latest general market headlines, and who published them?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Publisher,Title
get_press_releases:
  question: What are the five latest company press releases, with the symbol and publisher of each?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Symbol,Publisher,Title
get_crypto_news:
  question: What are the five latest cryptocurrency headlines, with the symbol and publisher of each?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Symbol,Publisher,Title
get_forex_news:
  question: What are the five latest forex headlines, with the currency pair and publisher of each?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Symbol,Publisher,Title
get_ipo_calendar:
  question: Which were the first five IPOs on the calendar, by symbol, from 1 January to 1 June 2024?
  tool: discovery
  arguments:
    start_date: "2024-01-01"
    end_date: "2024-06-01"
    limit: 5
get_ipo_disclosures:
  question: Which were the first five IPO disclosure filings, by symbol, from 1 January to 1 June 2024?
