get_index_constituents:
  question: Which companies are in the Dow Jones Industrial Average? Show the first five with their sector and the date each was added.
  tool: discovery
  arguments:
    index: Dow Jones
    limit: 5
    show_columns: Name,Sector,Date Added
get_stock_news:
