get_stock_screener:
  question: Which US technology companies currently have a market capitalization above $500 billion?
  tool: discovery
  arguments:
    country: US
    sector: Technology
    market_cap_higher: 500000000000
    primary_only: true
    limit: 10
get_stock_list:
  question: Show the first ten companies in the Finance Toolkit's list of stocks.
  tool: discovery
  arguments:
    limit: 10
get_stock_shares_float:
  question: What is the free float of the first ten companies in the Finance Toolkit's list of floating shares?
  tool: discovery
  arguments:
    limit: 10
get_sectors_performance:
  question: How did NASDAQ-listed technology, energy, healthcare and utilities stocks move each day in the first two weeks of April 2025?
  tool: discovery
  arguments:
    start_date: "2025-04-01"
    end_date: "2025-04-14"
get_biggest_gainers:
  question: Which stocks are currently the biggest gainers of the day?
  tool: discovery
  arguments:
    limit: 10
get_biggest_losers:
  question: Which stocks are currently the biggest losers of the day?
  tool: discovery
  arguments:
    limit: 10
get_most_active_stocks:
  question: Which stocks are currently the most actively traded, and how far have their prices moved?
  tool: discovery
  arguments:
    limit: 10
get_delisted_stocks:
  question: Which companies were delisted most recently?
  tool: discovery
  arguments:
    limit: 10
get_crypto_list:
  question: Show the first ten cryptocurrencies in the Finance Toolkit's list of cryptocurrencies.
  tool: discovery
  arguments:
    limit: 10
get_forex_list:
  question: Show the first ten currency pairs in the Finance Toolkit's list of currency pairs.
  tool: discovery
  arguments:
    limit: 10
get_commodity_list:
  question: Which commodities can I get prices for with the Finance Toolkit? Show the first twelve.
  tool: discovery
  arguments:
    limit: 12
get_etf_list:
  question: Show the first ten ETFs in the Finance Toolkit's list of ETFs.
  tool: discovery
  arguments:
    limit: 10
get_index_list:
  question: Show the first ten indices in the Finance Toolkit's list of indices.
  tool: discovery
  arguments:
    limit: 10
get_stock_news:
  question: Which stock market headlines were published on 1 December 2025?
  tool: discovery
  arguments:
    start_date: "2025-12-01"
    end_date: "2025-12-01"
    limit: 10
get_general_news:
  question: What are the latest general market headlines?
  tool: discovery
  arguments:
    limit: 10
get_press_releases:
  question: Which press releases did companies publish on 1 December 2025?
  tool: discovery
  arguments:
    start_date: "2025-12-01"
    end_date: "2025-12-01"
    limit: 10
get_crypto_news:
  question: What are the latest cryptocurrency headlines?
  tool: discovery
  arguments:
    limit: 10
get_forex_news:
  question: What are the latest forex headlines?
  tool: discovery
  arguments:
    limit: 10
get_ipo_calendar:
  question: Which IPOs were scheduled from 15 to 19 December 2025?
  tool: discovery
  arguments:
    start_date: "2025-12-15"
    end_date: "2025-12-19"
get_ipo_disclosures:
  question: Which IPO disclosure filings were made on 15 December 2025?
  tool: discovery
  arguments:
    start_date: "2025-12-15"
    end_date: "2025-12-15"
get_ipo_prospectuses:
