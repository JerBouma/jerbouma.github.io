    end_date: "2024-06-01"
    limit: 5
get_sector_performance:
  question: How did NASDAQ-listed energy stocks perform on each trading day from 19 to 23 October 2026?
  tool: discovery
  arguments:
    sector: Energy
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_industry_performance:
  question: How did NASDAQ-listed biotechnology stocks perform on each trading day from 19 to 23 October 2026?
  tool: discovery
  arguments:
    industry: Biotechnology
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_sector_pe:
  question: What was the P/E ratio of NASDAQ-listed energy stocks on each trading day from 19 to 23 October 2026?
  tool: discovery
  arguments:
    sector: Energy
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_industry_pe:
  question: How did the P/E ratio of NASDAQ-listed biotechnology stocks change on each trading day from 19 to 23 October 2026?
  tool: discovery
  arguments:
    industry: Biotechnology
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_mergers_acquisitions_latest:
  question: Which five mergers and acquisitions were announced most recently, with the acquirer, the target and the transaction date?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Company Name,Targeted Company Name,Transaction Date
get_earnings_calendar:
  question: Which five largest companies report earnings from 9 to 13 November 2026, counting each company once, and what earnings per share do analysts expect?
  tool: discovery
  arguments:
    start_date: "2026-11-09"
    end_date: "2026-11-13"
    primary_only: true
    sort_by: market_cap
    show_columns: "Date,Name,Exchange Code,Market Cap (USD),Estimated EPS"
    limit: 5
get_sec_filings_8k:
  question: Which 8-K filings were the latest to reach the SEC on 1 and 2 October 2026?
  tool: discovery
  arguments:
    start_date: "2026-10-01"
    end_date: "2026-10-02"
    limit: 5
    show_columns: Accepted Date,Has Financials,Final Link
get_insider_trading_latest:
  question: What were the five most recently reported insider trades, with the insider's name, the type of transaction, the number of shares and the price?
  tool: discovery
  arguments:
    limit: 5
    show_columns: Reporting Name,Transaction Type,Securities Transacted,Price
get_stock_screener:
  question: Which stocks, leaving out ETFs, have a market cap between $1 million and $200 billion, a price between $100 and $200, a beta between 1 and 1.5, a daily volume between 100,000 and 2 million shares and a dividend between $1 and $2 per share?
  tool: discovery
  arguments:
    market_cap_higher: 1000000
    market_cap_lower: 200000000000
    price_higher: 100
    price_lower: 200
    beta_higher: 1
    beta_lower: 1.5
    volume_higher: 100000
    volume_lower: 2000000
    dividend_higher: 1
    dividend_lower: 2
    is_etf: false
get_index_constituent_changes:
  question: Which companies joined and left the Dow Jones Industrial Average from 2020 to October 2026?
  tool: discovery
  arguments:
    index: Dow Jones
    start_date: "2020-01-01"
    end_date: "2026-10-31"
    show_columns: "Added Ticker,Removed Ticker,Change Type"
get_industry_statistics:
  question: What were the beta, cost of equity, after-tax cost of debt, debt weight and cost of capital of European semiconductor, software and general utility companies, and of the European market as a whole?
  tool: discovery
  arguments:
    dataset: cost_of_capital
    region: Europe
    show_columns: "Beta,Cost of Equity,After-tax Cost of Debt,D/(D+E),Cost of Capital"
