get_stock_list:
  question: Show the ten entries from DRNYX to DROOF in the Finance Toolkit's list of stocks.
  tool: discovery
  arguments:
    show_columns: DRNYX,DRNZ,DRO.AX,DROCX,DROME.AT,DRON.DE,DRON.L,DRONACHRYA.BO,DRONE.NS,DROOF
get_stock_shares_float:
  question: What is the free float of the ten companies from IMFP to IMHC in the Finance Toolkit's list of floating shares?
  tool: discovery
  arguments:
    show_columns: IMFP,IMG,IMG.TO,IMGI,IMGN,IMGP.L,IMGX,IMH,IMH.BK,IMHC
get_sectors_performance:
  question: How did each sector of NASDAQ-listed stocks move on each trading day from 19 to 23 October 2026?
  tool: discovery
  arguments:
    start_date: "2026-10-19"
    end_date: "2026-10-23"
get_biggest_gainers:
  question: Which ten stocks are the biggest gainers of the day?
  tool: discovery
  arguments:
    limit: 10
get_biggest_losers:
  question: Which ten stocks are the biggest losers of the day?
  tool: discovery
  arguments:
    limit: 10
get_most_active_stocks:
  question: Which ten stocks are the most actively traded today, and how far have their prices moved?
  tool: discovery
  arguments:
    limit: 10
get_delisted_stocks:
  question: Which ten companies were delisted most recently?
  tool: discovery
