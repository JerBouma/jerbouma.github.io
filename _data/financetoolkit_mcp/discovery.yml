    end_date: "2025-12-19"
get_stock_splits_calendar:
  question: Which share splits did Netflix and the ProShares ETFs TQQQ, SQQQ, SSO and SDS carry out from 17 to 21 November 2025?
  tool: discovery
  arguments:
    start_date: "2025-11-17"
    end_date: "2025-11-21"
get_earnings_calendar:
  question: What earnings per share did Nike, FedEx, Accenture and Cintas report on 18 December 2025, compared with the estimates?
  tool: discovery
  arguments:
    start_date: "2025-12-18"
    end_date: "2025-12-18"
    show_columns: Symbol,EPS,Estimated EPS
get_sec_filings_8k:
