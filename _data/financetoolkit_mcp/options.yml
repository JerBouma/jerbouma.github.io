  tool: options
  arguments:
    tickers: AAPL
    number_of_expirations: 3
get_risk_neutral_density:
  question: What probability distribution for Apple's share price at its nearest option expiration do current call prices imply?
  tool: options
  arguments:
    tickers: AAPL
    strike_price_range: 0.5
    number_of_strikes: 200
get_strategy_payoff:
  question: What is the profit or loss at expiry of a long $150 straddle on Amazon, paying $8 for the call and $6 for the put?
  tool: options
  arguments:
    tickers: AMZN
    legs:
    - strike_price: 150
      put_option: false
      position: long
      premium: 8
    - strike_price: 150
      put_option: true
      position: long
      premium: 6
    stock_price_range: 0.5
    stock_price_step_size: 1
