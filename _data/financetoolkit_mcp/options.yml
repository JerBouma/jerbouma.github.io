get_option_chains:
  question: Which of Apple's call options at the nearest expiration are in the money, and how are they priced?
  tool: options
  arguments:
    tickers: AAPL
get_black_scholes_model:
  question: What were Amazon's short-dated call options worth across strikes under the Black-Scholes model at the end of 2025?
  tool: options
  arguments:
    tickers: AMZN
    start_date: "2021-01-01"
    end_date: "2025-12-31"
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 10
get_implied_volatility:
  question: What is the implied volatility of Apple's call options at each strike for the nearest expiration?
  tool: options
  arguments:
    tickers: AAPL
get_binomial_model:
  question: What does a ten-step binomial tree look like for a one-year European call on Apple with a $140 strike, from 2 February 2024?
  tool: options
  arguments:
    tickers: AAPL
    start_date: "2021-01-01"
    end_date: "2024-02-02"
    strike_price_range: 0
    strike_step_size: 140
    time_to_expiration: 1
    timesteps: 10
get_stock_price_simulation:
  question: Which share prices can Amazon reach along every path of a one-year binomial tree with four steps, starting from the close of 20 June 2025?
  tool: options
  arguments:
    tickers: AMZN
    start_date: "2021-01-01"
    end_date: "2025-06-20"
    time_to_expiration: 1
    timesteps: 4
    show_unique_combinations: false
get_garman_kohlhagen:
  question: What is a call on Amazon worth under the Garman-Kohlhagen model with a 2% foreign interest rate, across strikes and expiries of up to a month?
  tool: options
  arguments:
    tickers: AMZN
    foreign_risk_free_rate: 0.02
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 30
get_bjerksund_stensland:
  question: What are American calls on Amazon worth under the Bjerksund-Stensland model, across strikes and expiries of up to a month?
  tool: options
  arguments:
    tickers: AMZN
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 30
get_monte_carlo_option_price:
  question: What are calls on Amazon worth in a Monte Carlo simulation of 10,000 price paths, across strikes and expiries of up to a month?
  tool: options
  arguments:
    tickers: AMZN
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 30
    simulations: 10000
    time_steps: 100
    seed: 42
get_binary_option:
  question: What is a cash-or-nothing call on Amazon paying $1 worth, across strikes and expiries of up to a month?
  tool: options
  arguments:
    tickers: AMZN
    option_type: cash-or-nothing
    cash_payout: 1.0
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 30
get_barrier_option:
  question: What is a down-and-out call on Amazon with its barrier at 90% of the share price worth, across strikes and expiries of up to a month?
  tool: options
  arguments:
    tickers: AMZN
    barrier_percentage: 0.9
    barrier_direction: down
    knock_type: out
    rebate: 0.0
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 30
get_asian_option:
  question: What is a geometric-average Asian call on Amazon worth, across strikes and expiries of up to a month?
  tool: options
  arguments:
    tickers: AMZN
    strike_price_range: 0.25
    strike_step_size: 5
    expiration_time_range: 30
get_put_call_parity:
  question: Do Black-Scholes call and put prices on Amazon satisfy put-call parity across strikes and expiries of up to a month?
