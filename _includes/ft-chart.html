{%- comment -%}
  An interactive Finance Toolkit chart, filled by assets/js/ft-charts.js from
  assets/data/financetoolkit-charts.json. Usage: {% include ft-chart.html id="historical" %}, or with
  src="/assets/data/article-charts.json" for the charts in the articles.
{%- endcomment -%}
<div class="ft-chart" data-chart="{{ include.id }}"{% if include.src %} data-src="{{ include.src }}"{% endif %} role="figure" aria-label="{{ include.label | default: include.id }}">
  <div class="ft-chart__loading" aria-hidden="true"></div>
</div>
