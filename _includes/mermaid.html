<script>
  function _initMermaid() {
    var theme = document.documentElement.getAttribute('data-theme');
    var isDark = theme !== 'light';

    // Nodes look like the site's cards: a quiet surface, a thin accent border and
    // readable text. Shape, shadow and edge labels are finished in custom.scss.
    var surface = isDark ? {
      node: '#132238', border: '#2d6f97', text: '#e2e8f0', line: '#5f88ab',
      label: '#0d1828', muted: '#94a3b8', cluster: '#0f1b2d', clusterBorder: '#22384f',
      note: '#1b2c44', accent: '#0284c7'
    } : {
      node: '#f2f8fc', border: '#8cc4e2', text: '#0f172a', line: '#7f9bb5',
      label: '#ffffff', muted: '#475569', cluster: '#f8fafc', clusterBorder: '#d5e2ec',
      note: '#fff7ed', accent: '#0284c7'
    };

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        darkMode: isDark,
        background: 'transparent',
        fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: '14px',

        primaryColor: surface.node,
        primaryBorderColor: surface.border,
        primaryTextColor: surface.text,
        secondaryColor: surface.node,
        secondaryBorderColor: surface.border,
        secondaryTextColor: surface.text,
        tertiaryColor: surface.cluster,
        tertiaryBorderColor: surface.clusterBorder,
        tertiaryTextColor: surface.text,
        mainBkg: surface.node,
        nodeBorder: surface.border,
        nodeTextColor: surface.text,
        textColor: surface.text,
        titleColor: surface.text,
        lineColor: surface.line,
        edgeLabelBackground: surface.label,
        clusterBkg: surface.cluster,
        clusterBorder: surface.clusterBorder,

        // sequence diagrams
        actorBkg: surface.node,
        actorBorder: surface.border,
        actorTextColor: surface.text,
        actorLineColor: surface.clusterBorder,
        signalColor: surface.line,
        signalTextColor: surface.text,
        labelBoxBkgColor: surface.node,
        labelBoxBorderColor: surface.border,
        labelTextColor: surface.text,
        loopTextColor: surface.muted,
        noteBkgColor: surface.note,
        noteBorderColor: surface.border,
        noteTextColor: surface.text,
        activationBkgColor: surface.border,
        activationBorderColor: surface.border,
        sequenceNumberColor: '#ffffff',

        // git graphs
        git0: isDark ? '#38bdf8' : '#0284c7',
        git1: isDark ? '#a78bfa' : '#7c3aed',
        git2: isDark ? '#34d399' : '#059669',
        git3: isDark ? '#fb923c' : '#ea580c',
        git4: isDark ? '#f472b6' : '#db2777',
        git5: isDark ? '#facc15' : '#ca8a04',
        git6: isDark ? '#67e8f9' : '#0891b2',
        git7: isDark ? '#c084fc' : '#9333ea',
        gitBranchLabel0: '#ffffff',
        gitBranchLabel1: '#ffffff',
        gitBranchLabel2: '#ffffff',
        gitBranchLabel3: '#ffffff',
        gitInv0: isDark ? '#0f172a' : '#ffffff',
        tagLabelColor: surface.text,
        tagLabelBackground: surface.node,
        tagLabelBorder: surface.border,
        commitLabelColor: surface.muted,
        commitLabelBackground: surface.label
      },
      flowchart: {
        curve: 'basis',
        padding: 14,
        nodeSpacing: 36,
        rankSpacing: 46,
        diagramPadding: 8,
        htmlLabels: true,
        useMaxWidth: true
      },
      sequence: {
        useMaxWidth: true,
        mirrorActors: false,
        width: 150,
        height: 44,
        actorMargin: 22,
        wrap: true,
        messageFontSize: 14,
        actorFontSize: 13,
        actorFontWeight: 600,
        boxMargin: 8,
        messageMargin: 34,
        noteMargin: 10,
        rightAngles: false,
        showSequenceNumbers: false
      },
      gitGraph: {
        useMaxWidth: true,
        showBranches: true,
        showCommitLabel: false,
        mainBranchName: 'main'
      }
    });

    // measure the labels with the page font, not the fallback it replaces
    // later (which cut the last letter off every label)
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { mermaid.run(); });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" defer onload="_initMermaid()"></script>
